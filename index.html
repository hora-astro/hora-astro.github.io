<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Fortune Kundli Entry</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places"></script>
    <style>
        body { font-family: sans-serif; background: #fffcf5; display: flex; justify-content: center; padding-top: 50px; }
        .box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 400px; border-top: 6px solid #800000; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { background: #800000; color: white; font-weight: bold; cursor: pointer; border: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="text-align:center; color:#800000;">✨ कुंडली सॉफ्टवेयर ✨</h2>
        <input type="text" id="uname" placeholder="नाम लिखें">
        <input type="date" id="date">
        <input type="time" id="time">
        <input type="text" id="citySearch" placeholder="शहर खोजें (Location Search)...">
        <input type="hidden" id="lat">
        <input type="hidden" id="lon">
        <button onclick="submit()">कुंडली बनाएँ</button>
    </div>

    <script>
        // Google Autocomplete Setup
        function initAutocomplete() {
            const input = document.getElementById('citySearch');
            const autocomplete = new google.maps.places.Autocomplete(input);
            autocomplete.addListener('place_changed', () => {
                const place = autocomplete.getPlace();
                document.getElementById('lat').value = place.geometry.location.lat();
                document.getElementById('lon').value = place.geometry.location.lng();
            });
        }
        google.maps.event.addDomListener(window, 'load', initAutocomplete);

        function submit() {
            const d = {
                custName: document.getElementById('uname').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                city: document.getElementById('citySearch').value,
                lat: document.getElementById('lat').value,
                lon: document.getElementById('lon').value
            };
            localStorage.setItem('kData', JSON.stringify(d));
            window.location.href = "report.html";
        }
    </script>
</body>
</html>
