<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>FortuneWithStars - Professional Astrology Software</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --maroon: #800000; --gold: #daa520; --light-yellow: #fffdf5; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #eee; margin: 0; font-size: 14px; }
        
        .toolbar { background: white; padding: 15px; display: flex; gap: 10px; border-bottom: 4px solid var(--maroon); position: sticky; top:0; z-index:100; flex-wrap: wrap; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input, select, button { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        
        .search-container { position: relative; }
        #suggestions { position: absolute; background: white; border: 1px solid #ccc; width: 100%; top: 40px; z-index: 101; display: none; max-height: 200px; overflow-y: auto; }
        #suggestions div { padding: 8px; cursor: pointer; border-bottom: 1px solid #eee; }

        .pdf-page { width: 210mm; min-height: 297mm; background: white; margin: 15px auto; padding: 12mm; box-sizing: border-box; page-break-after: always; border: 1px solid #ccc; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .page-border { border: 2px solid var(--maroon); padding: 15px; min-height: 265mm; position: relative; }
        
        .header-box { text-align: center; border-bottom: 2px double var(--maroon); margin-bottom: 15px; background: var(--light-yellow); padding: 10px; }
        
        .panchang-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; background: var(--light-yellow); }
        .panchang-table td { border: 1px solid var(--gold); padding: 8px; font-size: 13px; width: 33.3%; }

        .chart-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 15px 0; }
        .chart-box { border: 1px solid var(--maroon); padding: 10px; text-align: center; background: #fff; }

        .data-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        .data-table th { background: var(--maroon); color: white; padding: 8px; border: 1px solid #550000; }
        .data-table td { border: 1px solid #ddd; padding: 6px; text-align: center; }
        
        .high { color: green; font-weight: bold; }
        .low { color: red; font-weight: bold; }
        
        .prediction-text { padding: 15px; background: #fffdf0; border-left: 5px solid var(--gold); line-height: 1.6; text-align: justify; margin-bottom: 15px; border-bottom: 1px solid #eee; }
        
        h3 { color: var(--maroon); border-bottom: 1px solid var(--gold); padding-bottom: 5px; margin-top: 20px; text-transform: uppercase; }
        
        @media print { .toolbar { display: none; } .pdf-page { margin: 0; box-shadow: none; border: none; } }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="text" id="custName" value="हेमंत पुरोहित" placeholder="नाम">
    <input type="date" id="dob" value="1980-03-27">
    <input type="time" id="tob" value="10:30">
    <div class="search-container">
        <input type="text" id="citySearch" placeholder="स्थान खोजें..." oninput="searchLoc(this.value)">
        <div id="suggestions"></div>
    </div>
    Lat: <input type="text" id="lat" value="23.32" style="width:70px">
    Lon: <input type="text" id="lon" value="74.26" style="width:70px">
    <select id="ayanMode">
        <option value="NC_LAHIRI">NC Lahiri</option>
        <option value="KP">KP Ayanamsa</option>
    </select>
    <button onclick="generate()" style="background:var(--maroon); color:white; font-weight:bold; cursor:pointer">कुंडली जनरेट करें</button>
    <button onclick="downloadPDF()" style="background:green; color:white; cursor:pointer">PDF डाउनलोड</button>
</div>

<div id="printArea"></div>

<script>
async function searchLoc(q) {
    if(q.length < 3) return;
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}`);
    const data = await res.json();
    const box = document.getElementById('suggestions');
    box.innerHTML = ""; box.style.display = "block";
    data.slice(0, 5).forEach(item => {
        let div = document.createElement('div');
        div.innerText = item.display_name;
        div.onclick = () => {
            document.getElementById('lat').value = item.lat;
            document.getElementById('lon').value = item.lon;
            document.getElementById('citySearch').value = item.display_name.split(',')[0];
            box.style.display = "none";
        };
        box.appendChild(div);
    });
}

async function generate() {
    const payload = {
        date: document.getElementById('dob').value,
        time: document.getElementById('tob').value,
        lat: parseFloat(document.getElementById('lat').value),
        lon: parseFloat(document.getElementById('lon').value),
        ayanamsa: document.getElementById('ayanMode').value
    };

    try {
        const res = await fetch('https://hemantpurohit27.pythonanywhere.com/calculate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if(data.status === 'success') renderReport(data);
        else alert("Error: " + data.message);
    } catch (e) {
        alert("सर्वर त्रुटि: " + e.message);
    }
}

function renderReport(data) {
    let html = '';
    
    // PAGE 1: पंचांग, चार्ट और ग्रह स्थिति
    html += `<div class="pdf-page"><div class="page-border">
        <div class="header-box">
            <h1 style="margin:0; color:var(--maroon)">॥ FortuneWithStars वृहद कुंडली ॥</h1>
            <p><b>नाम:</b> ${document.getElementById('custName').value} | <b>स्थान:</b> ${document.getElementById('citySearch').value}</p>
        </div>

        <h3 style="margin-top:0">विस्तृत जन्म पंचांग</h3>
        <table class="panchang-table">
            <tr>
                <td><b>तिथि:</b> ${data.panchang.tithi} (${data.panchang.paksha})</td>
                <td><b>वार:</b> ${data.panchang.day}</td>
                <td><b>मास:</b> ${data.panchang.month || 'चैत्र'}</td>
            </tr>
            <tr>
                <td><b>नक्षत्र:</b> ${data.panchang.naks} (${data.panchang.charan} चरण)</td>
                <td><b>योग:</b> ${data.panchang.yoga || 'विष्कुम्भ'}</td>
                <td><b>करण:</b> ${data.panchang.karana || 'बव'}</td>
            </tr>
            <tr>
                <td><b>इष्टकाल:</b> ${data.panchang.ishtakal}</td>
                <td><b>गण:</b> ${data.panchang.gan}</td>
                <td><b>योनि:</b> ${data.panchang.yoni}</td>
            </tr>
            <tr>
                <td><b>नाड़ी:</b> ${data.panchang.nadi}</td>
                <td><b>वर्ण:</b> ${data.panchang.varna || 'ब्राह्मण'}</td>
                <td><b>अयनांश:</b> ${data.ayan_val}</td>
            </tr>
        </table>

        <div class="chart-container">
            <div class="chart-box"><b>लग्न कुंडली (D1)</b><div id="d1_svg"></div></div>
            <div class="chart-box"><b>नवांश कुंडली (D9)</b><div id="d9_svg"></div></div>
        </div>

        <h3>ग्रह स्पष्ट एवं नक्षत्र विवरण</h3>
        <table class="data-table">
            <thead>
                <tr><th>ग्रह</th><th>अंश</th><th>नक्षत्र</th><th>पद</th><th>भाव</th><th>D9</th><th>स्थिति</th></tr>
            </thead>
            <tbody>`;
    
    data.planets.forEach(p => {
        const sClass = p.status === 'उच्च' ? 'high' : (p.status === 'नीच' ? 'low' : '');
        html += `<tr>
            <td><b>${p.name}</b></td>
            <td>${p.deg}</td>
            <td>${p.naks}</td>
            <td>${p.charan}</td>
            <td>${p.house}</td>
            <td>${p.d9_sign}</td>
            <td class="${sClass}">${p.status || 'सम'}</td>
        </tr>`;
    });
    html += `</tbody></table></div></div>`;

    // PAGE 2: महादशा और डेटाबेस फलादेश
    html += `<div class="pdf-page"><div class="page-border">
        <h3>विंशोत्तरी महादशा विवरण</h3>
        <table class="data-table">
            <thead>
                <tr><th>स्वामी</th><th>प्रारंभ तिथि</th><th>समाप्ति तिथि</th></tr>
            </thead>
            <tbody>`;
    
    if(data.dashas) {
        data.dashas.forEach(d => {
            html += `<tr><td><b>${d.lord}</b></td><td>${d.start}</td><td>${d.end}</td></tr>`;
        });
    }

    html += `</tbody></table>

        <h3>सम्पूर्ण भाव एवं भावेश फलादेश</h3>`;
    
    if(data.predictions) {
        data.predictions.forEach((text, i) => {
            html += `<div class="prediction-text">
                <b style="color:var(--maroon)">भाव ${i+1} विश्लेषण:</b><br>${text}
            </div>`;
        });
    }
    
    html += `</div></div>`;

    document.getElementById('printArea').innerHTML = html;
    
    setTimeout(() => {
        drawNorthChart('d1_svg', data.lagna, data.planets, 'house');
        drawNorthChart('d9_svg', data.d9_lagna, data.planets, 'd9');
    }, 500);
}

function drawNorthChart(id, asc, planets, type) {
    const coords = {1:[112,85], 2:[55,45], 3:[25,85], 4:[75,135], 5:[25,185], 6:[55,225], 7:[112,185], 8:[170,225], 9:[200,185], 10:[150,135], 11:[200,85], 12:[170,45]};
    let svg = `<svg viewBox="0 0 225 240" width="100%"><path d="M0 0 L225 0 L225 225 L0 225 Z M0 0 L225 225 M225 0 L0 225 M112 0 L0 112 L112 225 L225 112 Z" fill="none" stroke="maroon" stroke-width="2"/>`;
    for (let i = 1; i <= 12; i++) {
        let sign = (asc + i - 2) % 12 + 1;
        svg += `<text x="${coords[i][0]}" y="${coords[i][1]}" fill="maroon" font-weight="bold" font-size="14" text-anchor="middle">${sign}</text>`;
        let list = (type === 'house') ? planets.filter(p => p.house === i) : planets.filter(p => p.d9_sign === sign);
        list.forEach((p, idx) => {
            svg += `<text x="${coords[i][0]}" y="${coords[i][1] + 14 + (idx * 11)}" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">${p.name}</text>`;
        });
    }
    document.getElementById(id).innerHTML = svg + `</svg>`;
}

async function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'a4');
    const pages = document.querySelectorAll('.pdf-page');
    for (let i = 0; i < pages.length; i++) {
        const canvas = await html2canvas(pages[i], { scale: 2 });
        if (i > 0) doc.addPage();
        doc.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 210, 297);
    }
    doc.save(`${document.getElementById('custName').value}_Kundli.pdf`);
}
</script>
</body>
</html>
