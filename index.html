<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>FortuneWithStars Pro - Commercial Version</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --maroon: #800000; --gold: #daa520; }
        body { font-family: 'Segoe UI', Arial; background: #eee; margin: 0; }
        .toolbar { background: white; padding: 15px; display: flex; gap: 10px; border-bottom: 4px solid var(--maroon); position: sticky; top:0; z-index:100; flex-wrap: wrap; }
        input, select, button { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        #suggestions { position: absolute; background: white; border: 1px solid #ccc; width: 250px; z-index: 101; display: none; }
        .pdf-page { width: 210mm; min-height: 297mm; background: white; margin: 20px auto; padding: 15mm; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .page-border { border: 3px double var(--maroon); height: 100%; padding: 10px; min-height: 260mm; }
        .panchang-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #fffdf0; padding: 15px; border: 1px solid var(--gold); }
        .chart-box { border: 1px solid var(--maroon); text-align: center; padding: 10px; }
        .prediction-card { border-left: 5px solid var(--gold); background: #f9f9f9; padding: 15px; margin: 15px 0; font-size: 14px; text-align: justify; }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="text" id="custName" value="हेमंत पुरोहित" placeholder="नाम">
    <input type="date" id="dob" value="1980-03-27">
    <input type="time" id="tob" value="10:30">
    <div style="position:relative">
        <input type="text" id="citySearch" placeholder="स्थान खोजें..." oninput="searchLoc(this.value)">
        <div id="suggestions"></div>
    </div>
    अक्षांश: <input type="text" id="lat" value="23.32" style="width:60px">
    देशांतर: <input type="text" id="lon" value="74.26" style="width:60px">
    अयानांश: <select id="ayanMode">
        <option value="NC_LAHIRI">NC Lahiri</option>
        <option value="KP">KP Ayanamsa</option>
    </select>
    <button onclick="generate()" style="background:var(--maroon); color:white">कुंडली बनाएँ</button>
    <button onclick="downloadPDF()" style="background:green; color:white">PDF (200 Page)</button>
</div>

<div id="printArea"></div>

<script>
async function searchLoc(q) {
    if(q.length < 3) return;
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}`);
    const data = await res.json();
    const box = document.getElementById('suggestions');
    box.innerHTML = ""; box.style.display = "block";
    data.slice(0,5).forEach(item => {
        let d = document.createElement('div');
        d.style.padding="8px"; d.style.cursor="pointer";
        d.innerText = item.display_name;
        d.onclick = () => {
            document.getElementById('lat').value = item.lat;
            document.getElementById('lon').value = item.lon;
            document.getElementById('citySearch').value = item.display_name.split(',')[0];
            box.style.display = "none";
        };
        box.appendChild(d);
    });
}

async function generate() {
    const payload = {
        date: document.getElementById('dob').value,
        time: document.getElementById('tob').value,
        lat: document.getElementById('lat').value,
        lon: document.getElementById('lon').value,
        ayanamsa: document.getElementById('ayanMode').value
    };

    const res = await fetch('https://hemantpurohit27.pythonanywhere.com/calculate', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    });
    const data = await res.json();
    renderReport(data);
}

function renderReport(data) {
    let html = `
    <div class="pdf-page"><div class="page-border">
        <h1 style="text-align:center; color:var(--maroon); margin:0">॥ FortuneWithStars वृहद कुंडली ॥</h1>
        <hr>
        <div class="panchang-grid">
            <div>नाम: <b>${document.getElementById('custName').value}</b></div>
            <div>स्थान: <b>${document.getElementById('citySearch').value}</b></div>
            <div>तिथि: <b>${data.panchang.tithi}</b></div>
            <div>नक्षत्र: <b>${data.panchang.nakshatra} (${data.panchang.charan})</b></div>
            <div>योग: <b>${data.panchang.yoga}</b></div>
            <div>करण: <b>${data.panchang.karana}</b></div>
            <div>इष्टकाल: <b>${data.panchang.ishtakal}</b></div>
            <div>नाड़ी: <b>${data.panchang.nadi}</b></div>
            <div>गण: <b>${data.panchang.gan}</b></div>
        </div>
        <div style="display:flex; gap:20px; margin-top:20px">
            <div class="chart-box" id="d1_svg" style="flex:1"></div>
            <div class="chart-box" id="d9_svg" style="flex:1"></div>
        </div>
        <div class="prediction-card">
            <b>विशेष फलादेश:</b> आपके लग्न का स्वामी 10वें भाव में है, जो संकेत देता है कि आपका करियर बहुत उज्ज्वल रहेगा...
            (यहाँ 200 पेज का डेटाबेस लूप में चलेगा)
        </div>
    </div></div>`;

    document.getElementById('printArea').innerHTML = html;
    drawChart('d1_svg', data.lagna, data.planets);
}

function drawChart(id, asc, planets) {
    // North Indian Style SVG Logic (संक्षिप्त)
    const coords = {1:[112,80], 2:[55,45], 3:[25,80], 4:[75,130], 5:[25,180], 6:[55,215], 7:[112,180], 8:[165,215], 9:[200,180], 10:[150,130], 11:[200,80], 12:[165,45]};
    let svg = `<svg viewBox="0 0 225 225" width="300"><path d="M0 0 L225 0 L225 225 L0 225 Z M0 0 L225 225 M225 0 L0 225 M112 0 L0 112 L112 225 L225 112 Z" fill="none" stroke="maroon" stroke-width="2"/>`;
    for(let i=1; i<=12; i++) {
        let sign = (asc + i - 2) % 12 + 1;
        svg += `<text x="${coords[i][0]}" y="${coords[i][1]}" font-size="12" fill="maroon">${sign}</text>`;
        planets.filter(p => p.house === i).forEach((p, idx) => {
            svg += `<text x="${coords[i][0]}" y="${coords[i][1]+12+(idx*10)}" font-size="8">${p.name}</text>`;
        });
    }
    document.getElementById(id).innerHTML = svg + `</svg>`;
}
</script>
</body>
</html>
