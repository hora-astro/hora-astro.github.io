<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HoraAstro • GitHub Pages</title>
  <style>
    :root { --pri:#6941c6; --pri2:#8358e8; --bg:#faf9ff; --card:#ffffff; --text:#1a1a1a; }
    body { font-family: system-ui, Arial, sans-serif; margin: 0; line-height: 1.5; background: var(--bg); color: var(--text); }
    header { background: linear-gradient(90deg, var(--pri), var(--pri2)); color:#fff; padding:16px 20px; }
    main { padding: 20px; }
    h1 { margin:0; font-size: 22px; }
    label { display: block; margin: 6px 0 0; }
    input, select { padding: 6px; width: 260px; border:1px solid #d9d9e3; border-radius:8px; }
    button { padding: 10px 14px; margin-top: 10px; background: var(--pri); color:#fff; border:none; border-radius:8px; cursor:pointer; }
    button.secondary { background:#eef; color:#333 }
    .row { display: flex; gap: 20px; flex-wrap: wrap; align-items:flex-start; }
    .card { background:var(--card); border: 1px solid #e6e3f5; border-radius: 12px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    pre { background: #f7f7f7; padding: 10px; border-radius: 6px; overflow: auto; }
    .error { color:#b00020; background:#fff1f2; border:1px solid #f0c; padding:8px 10px; border-radius:8px; display:none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.0/astronomy.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script>
    function norm(x){let a=x%360; if(a<0)a+=360; return a}
    function jdFromDate(date){return date.getTime()/86400000+2440587.5}
    function lahiriAy(time){
      const dt=time.date;const y=dt.getUTCFullYear();const m=dt.getUTCMonth()+1;const d=dt.getUTCDate();
      const frac=y+(m-0.5)/12+(d-1)/365.2425;const years=frac-2000;return 23.856111111+years*0.013968878
    }
    function chosenAyanamsaDeg(time){
      const mode=document.getElementById('ayan').value
      if(mode==='custom'){
        const deg=parseFloat(document.getElementById('ayanDeg').value||'0')
        return isFinite(deg)?deg:0
      }
      return lahiriAy(time)
    }
    function trop(body,time){return Astronomy.EclipticLongitude(body,time)}
    function meanNode(time){
      const jd=jdFromDate(time.date);const T=(jd-2451545)/36525;
      return norm(125.04452-1934.136261*T+0.0020708*T*T+T*T*T/450000)
    }
    function siderealLon(body,time){
      const ay=chosenAyanamsaDeg(time)
      if(body==='Rahu') return norm(meanNode(time)-ay)
      if(body==='Ketu') return norm(meanNode(time)+180-ay)
      return norm(trop(Astronomy.Body[body],time)-ay)
    }
    function retro(body,time){
      const dt=0.5, t1=new Astronomy.AstroTime(new Date(time.date.getTime()-dt*86400000))
      const t2=new Astronomy.AstroTime(new Date(time.date.getTime()+dt*86400000))
      const l1=trop(Astronomy.Body[body],t1), l2=trop(Astronomy.Body[body],t2)
      let d=l2-l1; if(d>180)d-=360; if(d<-180)d+=360; return d<0
    }
    const signs=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces']
    const signsHi={Aries:'मेष',Taurus:'वृषभ',Gemini:'मिथुन',Cancer:'कर्क',Leo:'सिंह',Virgo:'कन्या',Libra:'तुला',Scorpio:'वृश्चिक',Sagittarius:'धनु',Capricorn:'मकर',Aquarius:'कुंभ',Pisces:'मीन'}
    const nak=['Ashwini','Bharani','Krittika','Rohini','Mrigashirsha','Ardra','Punarvasu','Pushya','Ashlesha','Magha','Purva Phalguni','Uttara Phalguni','Hasta','Chitra','Swati','Vishakha','Anuradha','Jyeshtha','Mula','Purva Ashadha','Uttara Ashadha','Shravana','Dhanishta','Shatabhisha','Purva Bhadrapada','Uttara Bhadrapada','Revati']
    const nakHi={'Ashwini':'अश्विनी','Bharani':'भरणी','Krittika':'कृत्तिका','Rohini':'रोहिणी','Mrigashirsha':'मृगशिरा','Ardra':'आर्द्रा','Punarvasu':'पुनर्वसु','Pushya':'पुष्य','Ashlesha':'आश्रेषा','Magha':'मघा','Purva Phalguni':'पूर्व फाल्गुनी','Uttara Phalguni':'उत्तर फाल्गुनी','Hasta':'हस्त','Chitra':'चित्रा','Swati':'स्वाती','Vishakha':'विशाखा','Anuradha':'अनुराधा','Jyeshtha':'ज्येष्ठा','Mula':'मूल','Purva Ashadha':'पूर्वाषाढ़ा','Uttara Ashadha':'उत्तराषाढ़ा','Shravana':'श्रवण','Dhanishta':'धनिष्ठा','Shatabhisha':'शतभिषा','Purva Bhadrapada':'पूर्व भाद्रपदा','Uttara Bhadrapada':'उत्तर भाद्रपदा','Revati':'रेवती'}
    const yoga=['Vishkambha','Preeti','Ayushman','Saubhagya','Shobhana','Atiganda','Sukarma','Dhriti','Shoola','Ganda','Vriddhi','Dhruva','Vyaghata','Harshana','Vajra','Siddhi','Vyatipata','Variyana','Parigha','Shiva','Siddha','Sadhya','Subha','Shukla','Brahma','Indra','Vaidhriti']
    const yogaHi={'Vishkambha':'विष्कंभ','Preeti':'प्रीति','Ayushman':'आयुष्मान','Saubhagya':'सौभाग्य','Shobhana':'शोभन','Atiganda':'अतिगंड','Sukarma':'सुकर्मा','Dhriti':'धृति','Shoola':'शूल','Ganda':'गंड','Vriddhi':'वृद्धि','Dhruva':'ध्रुव','Vyaghata':'व्याघात','Harshana':'हर्षण','Vajra':'वज्र','Siddhi':'सिद्धि','Vyatipata':'व्यतीपात','Variyana':'वरीयान','Parigha':'परिघ','Shiva':'शिव','Siddha':'सिद्ध','Sadhya':'साध्य','Subha':'शुभ','Shukla':'शुक्ल','Brahma':'ब्रह्म','Indra':'इंद्र','Vaidhriti':'वैधृति'}
    const karAll=['Kimstughna','Bava','Balava','Kaulava','Taitila','Garaja','Vanija','Vishti','Shakuni','Chatushpada','Naga']
    const karHi={Kimstughna:'किम्स्तुघ्न',Bava:'बव',Balava:'बालव',Kaulava:'कौलव',Taitila:'तैतिल',Garaja:'गरज',Vanija:'वणिज',Vishti:'विष्टि',Shakuni:'शकुनि',Chatushpada:'चतुष्पद',Naga:'नाग'}
    const exalt={Sun:'Aries',Moon:'Taurus',Mars:'Capricorn',Mercury:'Virgo',Jupiter:'Cancer',Venus:'Pisces',Saturn:'Libra',Rahu:'Taurus',Ketu:'Scorpio'}
    const debil={Sun:'Libra',Moon:'Scorpio',Mars:'Cancer',Mercury:'Pisces',Jupiter:'Capricorn',Venus:'Virgo',Saturn:'Aries',Rahu:'Scorpio',Ketu:'Taurus'}
    function weekdayHi(d){return ['रविवार','सोमवार','मंगलवार','बुधवार','गुरुवार','शुक्रवार','शनिवार'][d]}
    function monthHi(m){return ['जनवरी','फ़रवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'][m]}
    function toUTC(y,m,d,hh,mm,ss,tz){return new Date(Date.UTC(y,m-1,d,hh,mm,ss)-(tz*60000))}
    function fmtLocalISO(utc,tz){
      const ms=utc.getTime()+tz*60000;const l=new Date(ms)
      const pad=n=>String(n).padStart(2,'0')
      const sign=tz>=0?'+':'-';const a=Math.abs(tz);const oh=pad(Math.floor(a/60));const om=pad(a%60)
      return `${l.getUTCFullYear()}-${pad(l.getUTCMonth()+1)}-${pad(l.getUTCDate())}T${pad(l.getUTCHours())}:${pad(l.getUTCMinutes())}:${pad(l.getUTCSeconds())}${sign}${oh}:${om}`
    }
    function sidAngles(time){
      const ay=chosenAyanamsaDeg(time)
      const sun=norm(trop(Astronomy.Body.Sun,time)-ay)
      const moon=norm(trop(Astronomy.Body.Moon,time)-ay)
      return {sun,moon,sum:norm(sun+moon),diff:norm(moon-sun),sidMoon:moon}
    }
    function nakAt(time){
      const L=sidAngles(time).sidMoon;const size=360/27;const idx=Math.floor(L/size)
      const within=L-idx*size;const pada=Math.floor(within/(size/4))+1
      return {name:nak[idx],pada}
    }
    function yogaAt(time){const size=360/27;const idx=Math.floor(sidAngles(time).sum/size);return yoga[idx]}
    function karNameByHalfIndex(hi){
      if(hi===0) return 'Kimstughna'
      if(hi>=1&&hi<=56){const seq=['Bava','Balava','Kaulava','Taitila','Garaja','Vanija','Vishti'];return seq[(hi-1)%7]}
      if(hi===57) return 'Shakuni'; if(hi===58) return 'Chatushpada'; return 'Naga'
    }
    function karAt(time){
      const diff=sidAngles(time).diff; const tIdx=Math.floor(diff/12); const frac=diff/12-tIdx
      const hi=Math.floor(frac*2)+tIdx*2; return karNameByHalfIndex(hi)
    }
    function fortnightAt(time){const t=Math.floor(sidAngles(time).diff/12)+1;return t<=15?'शुक्ल पक्ष':'कृष्ण पक्ष'}
    function signOf(L){return signs[Math.floor(norm(L)/30)]}
    function navamsaOf(L,sign){
      const idx=signs.indexOf(sign);const within=norm(L)-idx*30;const pada=Math.floor((within/30)*9)
      const movable=['Aries','Cancer','Libra','Capricorn'].includes(sign)
      const fixed=['Taurus','Leo','Scorpio','Aquarius'].includes(sign)
      let start=0; if(movable) start=idx; else if(fixed) start=(idx+8)%12; else start=(idx+4)%12
      return signs[(start+pada)%12]
    }
    function positions(time){
      const bodies=['Sun','Moon','Mars','Mercury','Jupiter','Venus','Saturn','Rahu','Ketu']
      const out=[]
      for(const b of bodies){
        const L=siderealLon(b,time); const s=signOf(L); const n=navamsaOf(L,s)
        const r=(b==='Rahu'||b==='Ketu')?false:retro(b,time)
        out.push({body:b, longitude:L, sign:s, navamsa:n, retrograde:r, exalted:s===exalt[b], debilitated:s===debil[b]})
      }
      return out
    }
    function dasha(time){
      const size=360/27; const L=sidAngles(time).sidMoon; const nidx=Math.floor(L/size); const frac=(L-nidx*size)/size
      const order=['Ketu','Venus','Sun','Moon','Mars','Rahu','Jupiter','Saturn','Mercury']
      const yrs={Ketu:7,Venus:20,Sun:6,Moon:10,Mars:7,Rahu:18,Jupiter:16,Saturn:19,Mercury:17}
      const lord=order[nidx%9]; const rem=yrs[lord]*(1-frac)
      const start=time.date; const periods=[]
      let cur=lord; let s=new Date(start); let first=true
      for(let i=0;i<18;i++){
        const years=first?rem:yrs[cur]; const e=new Date(s.getTime()+years*365.2425*86400000)
        periods.push({lord:cur,start:s.toISOString(),end:e.toISOString()})
        s=e; cur=order[(order.indexOf(cur)+1)%9]; first=false
      }
      const mahaStart=new Date(start.getTime()- (yrs[lord]-rem)*365.2425*86400000)
      const antaraSeq=order.map(l=>({lord:l, years: yrs[lord]*yrs[l]/120}))
      let cs=new Date(mahaStart); let current={lord:lord,start:cs,end:cs}
      for(const a of antaraSeq){const e=new Date(cs.getTime()+a.years*365.2425*86400000); if(start>=cs&&start<e){current={lord:a.lord,start:cs,end:e}; break} cs=e}
      return {mahadasha:periods, current:{maha:lord, antara:current.lord, start:current.start.toISOString(), end:current.end.toISOString()}}
    }
    function dosha(pos){
      const signsArr=signs
      const moon=pos.find(p=>p.body==='Moon'), mars=pos.find(p=>p.body==='Mars'), saturn=pos.find(p=>p.body==='Saturn')
      const idx=(s)=>signsArr.indexOf(s)
      const sade=[moon.sign, signsArr[(idx(moon.sign)+11)%12], signsArr[(idx(moon.sign)+1)%12]].includes(saturn.sign)
      const dist=((idx(mars.sign)-idx(moon.sign)+12)%12)+1
      const manglik=[1,2,4,7,8,12].includes(dist)
      return {manglikFromMoon:manglik, sadeSati:sade}
    }
    async function run(){
      const errBox=document.getElementById('errorBox'); errBox.style.display='none'; errBox.textContent=''
      const outEl=document.getElementById('output'); outEl.textContent=''
      try{
        if(typeof Astronomy==='undefined'){ throw new Error('Astronomy Engine लोड नहीं हुआ। पेज रीलोड करें।') }
        const y = +document.getElementById('year').value
        const m = +document.getElementById('month').value
        const d = +document.getElementById('day').value
        const hh = +document.getElementById('hour').value
        const mm = +document.getElementById('minute').value
        const tz = +document.getElementById('tzm').value
        const lat = +document.getElementById('latit').value
        const lon = +document.getElementById('longit').value
        const place = document.getElementById('placeEl').value
        const name = document.getElementById('person').value
        if(!isFinite(y)||!isFinite(m)||!isFinite(d)||!isFinite(hh)||!isFinite(mm)||!isFinite(tz)){
          throw new Error('तिथि/समय/टाइमज़ोन इनपुट सही भरें।')
        }
        const utc=toUTC(y,m,d,hh,mm,0,tz)
        const time=new Astronomy.AstroTime(utc)
        const pn=nakAt(time), py=yogaAt(time), pk=karAt(time)
        const panch={weekday:weekdayHi(new Date(utc.getTime()+tz*60000).getUTCDay()), monthName:monthHi(new Date(utc.getTime()+tz*60000).getUTCMonth()), dateISO:fmtLocalISO(utc,tz), fortnight:fortnightAt(time), nakshatra:pn, yoga:py, karana:pk}
        const pos=positions(time)
        const dash=dasha(time)
        const dsh=dosha(pos)
        // Abhijit Muhurta
        const midnightLocalUTC=toUTC(y,m,d,0,0,0,tz)
        let abhijit=undefined
        try{
          const obs={latitude:lat, longitude:lon, height:0}
          const t0=new Astronomy.AstroTime(midnightLocalUTC)
          const sunrise=Astronomy.SearchRiseSet(Astronomy.Body.Sun, obs, +1, t0, 1)
          const sunset=Astronomy.SearchRiseSet(Astronomy.Body.Sun, obs, -1, t0, 1)
          if(sunrise && sunset){
            const noonEvt=Astronomy.SearchHourAngle(Astronomy.Body.Sun, obs, 0, sunrise, 0.5)
            if(noonEvt){
              const dayMinutes=(sunset.date.getTime()-sunrise.date.getTime())/60000
              const halfWidth=dayMinutes/30
              const startUTC=new Date(noonEvt.time.date.getTime()-halfWidth*60000)
              const endUTC=new Date(noonEvt.time.date.getTime()+halfWidth*60000)
              abhijit={ start: fmtLocalISO(startUTC,tz), end: fmtLocalISO(endUTC,tz) }
            }
          }
        }catch(e){ /* ignore muhurta errors */ }
        const out={header:{name, place, dateISO:fmtLocalISO(utc,tz)}, panchanga:{moment:panch, day:{ muhurta: { abhijit } }}, charts:{d1:pos, d9:pos}, dasha:dash, dosha:dsh}
        outEl.textContent=JSON.stringify(out,null,2)
      }catch(err){
        errBox.textContent=String(err?.message||err)
        errBox.style.display='block'
        console.error(err)
      }
    }
    async function makePdf(){
      const { jsPDF } = window.jspdf
      const doc=new jsPDF()
      const data=JSON.parse((document.getElementById('output').textContent)||'{}')
      if(!data.header){alert('पहले JSON तैयार करें');return}
      doc.setFontSize(16); doc.text('जन्म कुंडली रिपोर्ट', 105, 14, {align:'center'})
      doc.setFontSize(11)
      doc.text(`नाम: ${data.header.name}`, 14, 26)
      doc.text(`स्थान: ${data.header.place}`, 14, 32)
      const p=data.panchanga.moment
      doc.text(`दिन/तिथि: ${p.weekday}, ${p.monthName} - ${data.header.dateISO}`, 14, 38)
      doc.text(`पक्ष: ${p.fortnight}`, 14, 44)
      doc.text(`नक्षत्र/पाद: ${nakHi[p.nakshatra.name]||p.nakshatra.name} / ${p.nakshatra.pada}`, 14, 50)
      doc.text(`योग: ${yogaHi[p.yoga]||p.yoga}`, 14, 56)
      doc.text(`करण: ${karHi[p.karana]||p.karana}`, 14, 62)
      const muh = (data.panchanga.day && data.panchanga.day.muhurta && data.panchanga.day.muhurta.abhijit) ? data.panchanga.day.muhurta.abhijit : null
      if(muh && muh.start && muh.end){
        doc.text(`अभिजीत मुहूर्त: ${muh.start} → ${muh.end}`, 14, 68)
      }
      let y= (muh && muh.start)? 76 : 72; doc.setFontSize(12); doc.text('ग्रह स्थिति (D1/D9):',14,y); y+=6; doc.setFontSize(10)
      for(const g of data.charts.d1){
        const s=signsHi[g.sign]||g.sign, n=signsHi[g.navamsa]||g.navamsa
        const attrs=[g.retrograde?'वक्री':'',g.exalted?'उच्च':'',g.debilitated?'नीच':''].filter(Boolean).join(', ')
        doc.text(`${g.body}: राशि ${s}  नवांश ${n} ${attrs? '('+attrs+')':''}`,14,y); y+=6; if(y>280){doc.addPage(); y=20}
      }
      y+=4; doc.setFontSize(12); doc.text('वर्तमान दशा:',14,y); y+=6; doc.setFontSize(10)
      doc.text(`महादशा: ${data.dasha.current.maha}  अंतरदशा: ${data.dasha.current.antara}`,14,y); y+=6
      doc.text(`अंतरदशा अवधि: ${data.dasha.current.start} → ${data.dasha.current.end}`,14,y); y+=6
      y+=4; doc.setFontSize(12); doc.text('दोष संकेत:',14,y); y+=6; doc.setFontSize(10)
      doc.text(`मांगलिक (चंद्र से): ${data.dosha.manglikFromMoon?'हाँ':'नहीं'}`,14,y); y+=6
      doc.text(`शनि साढ़ेसाती: ${data.dosha.sadeSati?'चल रही है':'नहीं'}`,14,y)
      doc.save('horoscope.pdf')
    }
    window.addEventListener('DOMContentLoaded',()=>{
      document.getElementById('gen').addEventListener('click', run)
      document.getElementById('pdf').addEventListener('click', makePdf)
      const placeSearch=document.getElementById('placeSearch')
      const list=document.getElementById('placeList')
      const placeMap=new Map()
      let lastQuery=''
      const aySel=document.getElementById('ayan')
      const ayDeg=document.getElementById('ayanDeg')
      aySel.addEventListener('change', ()=>{
        if(aySel.value==='custom'){ ayDeg.disabled=false } else { ayDeg.disabled=true }
      })
      placeSearch.addEventListener('input', async (e)=>{
        const q=placeSearch.value.trim()
        if(q.length<3 || q===lastQuery) return
        lastQuery=q
        placeMap.clear(); list.innerHTML=''
        try{
          const resp=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5`,{headers:{'Accept':'application/json'}})
          const arr=await resp.json()
          arr.forEach(item=>{
            const name=item.display_name
            placeMap.set(name,{lat:parseFloat(item.lat), lon:parseFloat(item.lon)})
            const opt=document.createElement('option')
            opt.value=name
            list.appendChild(opt)
          })
        }catch(err){}
      })
      placeSearch.addEventListener('change', async ()=>{
        const val=placeSearch.value
        if(!val) return
        let hit=placeMap.get(val)
        if(!hit){
          try{
            const resp=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val)}&limit=1`,{headers:{'Accept':'application/json'}})
            const arr=await resp.json()
            if(arr && arr[0]) hit={lat:parseFloat(arr[0].lat), lon:parseFloat(arr[0].lon)}
          }catch(e){}
        }
        if(hit){ document.getElementById('placeEl').value=val; document.getElementById('latit').value=hit.lat.toFixed(6); document.getElementById('longit').value=hit.lon.toFixed(6) }
      })
    })
  </script>
</head>
  <body>
  <header><h1>HoraAstro • GitHub Pages</h1></header>
  <main>
  <div class="row">
    <div class="card">
      <label>नाम <input id="person" value="राम कुमार"></label>
      <label>स्थान <input id="placeEl" value="नई दिल्ली"></label>
      <label>जन्म स्थान (Auto-Search)
        <input id="placeSearch" list="placeList" placeholder="शहर/स्थान खोजें">
        <datalist id="placeList"></datalist>
      </label>
      <label>अयनांश (Ayanamsa)
        <select id="ayan">
          <option value="lahiri">लहीड़ी (डिफ़ॉल्ट)</option>
          <option value="custom">कस्टम (डिग्री)</option>
        </select>
      </label>
      <label id="ayanDegWrap" style="display:block">कस्टम अयनांश (°)
        <input id="ayanDeg" type="number" step="0.0001" value="0" disabled>
      </label>
      <label>वर्ष <input id="year" type="number" value="1990"></label>
      <label>माह <input id="month" type="number" value="5"></label>
      <label>तारीख <input id="day" type="number" value="12"></label>
      <label>घंटा <input id="hour" type="number" value="10"></label>
      <label>मिनट <input id="minute" type="number" value="30"></label>
      <label>टाइमज़ोन ऑफ़सेट (मिनट) <input id="tzm" type="number" value="330"></label>
      <label>अक्षांश <input id="latit" type="number" value="28.6139" step="0.0001"></label>
