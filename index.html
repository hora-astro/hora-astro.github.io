<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>वैदिक ज्योतिष रिपोर्ट - कमर्शियल एडिशन</title>
    <style>
        :root { --primary: #b01a1a; --gold: #d4af37; --bg: #fffbf2; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 3px double var(--primary); margin-bottom: 25px; }
        
        /* Panchang Grid */
        .p-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 30px; }
        .p-card { background: #fff8e1; border: 1px solid var(--gold); padding: 10px; border-radius: 8px; text-align: center; }
        .p-card b { color: var(--primary); display: block; font-size: 11px; }

        /* Charts */
        .chart-flex { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; }
        .chart-box { border: 2px solid var(--primary); padding: 10px; border-radius: 10px; background: white; }
        svg { width: 330px; height: 330px; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th { background: var(--primary); color: white; padding: 12px; }
        td { border: 1px solid #ddd; padding: 10px; text-align: center; }

        /* Dasha Accordion */
        .dasha-item { border: 1px solid #ddd; margin-bottom: 8px; border-radius: 8px; }
        .dasha-head { background: #fef1f1; padding: 15px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--primary); }
        .antar-list { display: none; padding: 15px; background: white; border-top: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="userName" style="color: var(--primary);">कुंडली विश्लेषण</h1>
    </div>

    <div id="panchangGrid" class="p-grid"></div>

    <div class="chart-flex">
        <div id="d1" class="chart-box"></div>
        <div id="d9" class="chart-box"></div>
    </div>
    

    <table>
        <thead>
            <tr><th>ग्रह</th><th>भाव</th><th>डिग्री</th><th>नक्षत्र-चरण</th></tr>
        </thead>
        <tbody id="planetTable"></tbody>
    </table>

    <h2 style="color: var(--primary); margin-top: 40px;">विंशोत्तरी महादशा एवं अंतर्दशा</h2>
    <div id="dashaBox"></div>
</div>

<script>
    window.onload = async () => {
        const stored = JSON.parse(localStorage.getItem('kundliData'));
        const response = await fetch('https://hemantpurohit27.pythonanywhere.com/calculate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(stored)
        });
        const data = await response.json();
        
        if(data.status === 'success') {
            document.getElementById('userName').innerText = data.name + " की विस्तृत जन्मपत्री";
            
            // Render Panchang
            let pHtml = "";
            data.panchang.forEach(p => { 
                pHtml += `<div class="p-card"><b>${p.k}</b><span>${p.v}</span></div>`; 
            });
            document.getElementById('panchangGrid').innerHTML = pHtml;

            // Render Planet Table
            let pRows = "";
            data.planets.forEach(p => {
                pRows += `<tr><td><b>${p.name}</b></td><td>${p.house}</td><td>${p.deg}</td><td>${p.nak}</td></tr>`;
            });
            document.getElementById('planetTable').innerHTML = pRows;

            // Draw Charts
            drawKundli('d1', data.lagna, data.planets, 'house', 'लग्न कुंडली (D1)');
            drawKundli('d9', data.d9_lagna, data.planets, 'd9', 'नवांश कुंडली (D9)');

            // Render Dashas
            let dHtml = "";
            data.dashas.forEach((d, i) => {
                dHtml += `
                <div class="dasha-item">
                    <div class="dasha-head" onclick="toggleD(${i})">
                        <span>${d.lord} महादशा</span>
                        <span style="font-size:12px; font-weight:normal;">${d.start} - ${d.end}</span>
                    </div>
                    <div id="d-${i}" class="antar-list">
                        ${d.antars.map(a => `<div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #f9f9f9"><span>${a.lord}</span><span>${a.start} - ${a.end}</span></div>`).join('')}
                    </div>
                </div>`;
            });
            document.getElementById('dashaBox').innerHTML = dHtml;
        }
    };

    function toggleD(i) {
        const list = document.getElementById('d-'+i);
        list.style.display = list.style.display === 'block' ? 'none' : 'block';
    }

    function drawKundli(id, asc, planets, key, title) {
        const pos = {1:[150,110], 2:[75,60], 3:[35,110], 4:[100,160], 5:[35,230], 6:[75,280], 7:[150,230], 8:[225,280], 9:[265,230], 10:[200,160], 11:[265,110], 12:[225,60]};
        let s = `<svg viewBox="0 0 300 340"><text x="150" y="25" text-anchor="middle" font-weight="bold" fill="#b01a1a">${title}</text>
        <path d="M10 50 L290 50 L290 330 L10 330 Z M10 50 L290 330 M290 50 L10 330 M150 50 L10 190 L150 330 L290 190 Z" fill="none" stroke="#b01a1a" stroke-width="2"/>`;
        for(let i=1; i<=12; i++) {
            let sign = (asc + i - 2) % 12 + 1;
            s += `<text x="${pos[i][0]}" y="${pos[i][1]+20}" fill="#b01a1a" font-weight="bold">${sign}</text>`;
            let pNames = planets.filter(p => p[key] == i).map(p => p.name).join(' ');
            s += `<text x="${pos[i][0]}" y="${pos[i][1]+45}" font-size="11" text-anchor="middle">${pNames}</text>`;
        }
        document.getElementById(id).innerHTML = s + `</svg>`;
    }
</script>
</body>
</html>
