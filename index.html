<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Fortune Pro Software</title>
    <style>
        body { font-family: sans-serif; background: #fffcf5; padding: 40px; }
        .box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 450px; margin: auto; border-top: 8px solid #800000; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .geo-row { display: flex; gap: 10px; }
        #res { position: absolute; background: white; border: 1px solid #ddd; width: 390px; z-index: 100; display: none; }
        .res-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
        button { background: #800000; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="text-align:center; color:#800000;">✨ कमर्शियल कुंडली सॉफ्टवेयर ✨</h2>
        <input type="text" id="uname" placeholder="नाम">
        <input type="date" id="date"><input type="time" id="time">
        
        <div style="position:relative;">
            <input type="text" id="city" placeholder="शहर खोजें (जैसे: Banswara)..." oninput="searchLoc(this.value)">
            <div id="res"></div>
        </div>

        <div class="geo-row">
            <input type="text" id="lat" placeholder="अक्षांश (Lat)">
            <input type="text" id="lon" placeholder="देशांतर (Lon)">
        </div>

        <select id="ayan"><option>NC Lahiri</option><option>KP Ayanamsa</option></select>
        <button onclick="go()">कुंडली बनाएँ</button>
    </div>

    <script>
        async function searchLoc(q) {
            if(q.length < 3) return;
            const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}`);
            const data = await r.json();
            let h = "";
            data.slice(0, 5).forEach(i => {
                h += `<div class="res-item" onclick="setLoc('${i.display_name}',${i.lat},${i.lon})">${i.display_name}</div>`;
            });
            document.getElementById('res').innerHTML = h;
            document.getElementById('res').style.display = 'block';
        }
        function setLoc(n, lt, ln) {
            document.getElementById('city').value = n;
            document.getElementById('lat').value = lt;
            document.getElementById('lon').value = ln;
            document.getElementById('res').style.display = 'none';
        }
        function go() {
            const d = { custName: document.getElementById('uname').value, date: document.getElementById('date').value, time: document.getElementById('time').value, city: document.getElementById('city').value, lat: document.getElementById('lat').value, lon: document.getElementById('lon').value, ayan_mode: document.getElementById('ayan').value };
            localStorage.setItem('kData', JSON.stringify(d));
            window.location.href = "report.html";
        }
    </script>
</body>
</html>
