<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortune Pro - ज्योतिष इनपुट</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fff8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; border-top: 8px solid #800000; }
        h2 { color: #800000; text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #800000; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #5a0000; }
        #city-list { position: absolute; background: white; border: 1px solid #ddd; width: 100%; z-index: 10; display: none; }
        .city-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="card">
        <h2>☸ Fortune Pro</h2>
        <input type="text" id="name" placeholder="जातक का नाम">
        <input type="date" id="date">
        <input type="time" id="time">
        <div style="position:relative;">
            <input type="text" id="city" placeholder="शहर खोजें..." oninput="searchCity(this.value)">
            <div id="city-list"></div>
        </div>
        <input type="hidden" id="lat"><input type="hidden" id="lon">
        <button onclick="submitData()">कुंडली विश्लेषण</button>
    </div>

    <script>
        async function searchCity(q) {
            if(q.length < 3) return;
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}`);
            const data = await res.json();
            let html = "";
            data.slice(0,5).forEach(c => {
                html += `<div class="city-item" onclick="setCity('${c.display_name}',${c.lat},${c.lon})">${c.display_name}</div>`;
            });
            document.getElementById('city-list').innerHTML = html;
            document.getElementById('city-list').style.display = 'block';
        }
        function setCity(n, lt, ln) {
            document.getElementById('city').value = n;
            document.getElementById('lat').value = lt;
            document.getElementById('lon').value = ln;
            document.getElementById('city-list').style.display = 'none';
        }
        function submitData() {
            const d = { custName: document.getElementById('name').value, date: document.getElementById('date').value, time: document.getElementById('time').value, lat: document.getElementById('lat').value, lon: document.getElementById('lon').value, city: document.getElementById('city').value };
            localStorage.setItem('astroData', JSON.stringify(d));
            window.location.href = "report.html";
        }
    </script>
</body>
</html>
