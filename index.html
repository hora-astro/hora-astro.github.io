<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><title>Fortune Pro Pro</title>
<style>
    body { font-family: sans-serif; background: #fffcf5; padding: 40px; display: flex; justify-content: center; }
    .box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); width: 450px; border-top: 8px solid #800000; }
    input, select, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
    button { background: #800000; color: white; font-weight: bold; cursor: pointer; }
    #res { position: absolute; background: white; border: 1px solid #ddd; width: 390px; z-index: 100; display: none; }
    .item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
</style></head>
<body>
    <div class="box">
        <h2 style="text-align:center; color:#800000;">Commercial Kundli Software</h2>
        <input type="text" id="name" placeholder="जातक का नाम">
        <input type="date" id="date"><input type="time" id="time">
        <input type="text" id="city" placeholder="शहर खोजें..." oninput="search(this.value)"><div id="res"></div>
        <div style="display:flex; gap:10px;"><input type="text" id="lat" placeholder="Lat"><input type="text" id="lon" placeholder="Lon"></div>
        <select id="ayan"><option value="Lahiri">NC Lahiri</option><option value="KP">KP Ayanamsa</option><option value="Raman">B.V. Raman</option></select>
        <button onclick="save()">कुंडली जेनरेट करें</button>
    </div>
    <script>
        async function search(q) {
            if(q.length<3) return;
            const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}`);
            const data = await r.json();
            let h = ""; data.slice(0,5).forEach(i => h += `<div class="item" onclick="set('${i.display_name}',${i.lat},${i.lon})">${i.display_name}</div>`);
            document.getElementById('res').innerHTML = h; document.getElementById('res').style.display='block';
        }
        function set(n,lt,ln) { document.getElementById('city').value=n; document.getElementById('lat').value=lt; document.getElementById('lon').value=ln; document.getElementById('res').style.display='none'; }
        function save() {
            const d = { custName: document.getElementById('name').value, date: document.getElementById('date').value, time: document.getElementById('time').value, city: document.getElementById('city').value, lat: document.getElementById('lat').value, lon: document.getElementById('lon').value, ayan_type: document.getElementById('ayan').value };
            localStorage.setItem('kData', JSON.stringify(d)); window.location.href = "report.html";
        }
</script>
</body>
</html>
