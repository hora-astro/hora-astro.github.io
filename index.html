<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Fortune Kundli - Entry</title>
    <style>
        body { font-family: sans-serif; background: #fffcf5; display: flex; justify-content: center; padding: 50px; }
        .box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.1); width: 400px; border-top: 5px solid #800000; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #800000; color: white; font-weight: bold; cursor: pointer; border: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="text-align:center; color:#800000;">✨ कुंडली सॉफ्टवेयर ✨</h2>
        <input type="text" id="uname" placeholder="नाम लिखें">
        <input type="date" id="date">
        <input type="time" id="time">
        <input type="text" id="city" placeholder="शहर (जैसे: Banswara)">
        <div style="display:flex; gap:10px;">
            <input type="text" id="lat" placeholder="अक्षांश (23.32)">
            <input type="text" id="lon" placeholder="देशांतर (74.26)">
        </div>
        <button onclick="saveAndGo()">कुंडली बनाएं</button>
    </div>

    <script>
        function saveAndGo() {
            const data = {
                custName: document.getElementById('uname').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                lat: document.getElementById('lat').value || "23.32",
                lon: document.getElementById('lon').value || "74.26",
                city: document.getElementById('city').value
            };
            localStorage.setItem('kundliData', JSON.stringify(data));
            window.location.href = "report.html";
        }
    </script>
</body>
</html>
