<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HoraAstro Pro X • Enterprise Suite</title>

<style>
:root {
  --pri:#4f46e5;
  --bg:#f1f5f9;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;
}

body {margin:0;font-family:Segoe UI;background:var(--bg);color:var(--text);}

header {
  background:linear-gradient(90deg,#4f46e5,#7c3aed);
  color:white;padding:18px;text-align:center;
}

main {
  display:grid;
  grid-template-columns:320px 1fr;
  gap:20px;
  max-width:1400px;
  margin:auto;
  padding:20px;
}

.card {
  background:white;
  border-radius:12px;
  padding:18px;
  border:1px solid var(--border);
}

input,select,button {
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
  border:1px solid var(--border);
}

button {
  background:var(--pri);
  color:white;
  font-weight:600;
  cursor:pointer;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;
}

.box {
  background:#eef2ff;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

.tabs {display:flex;gap:5px;margin-bottom:10px;}
.tab {flex:1;padding:8px;border:none;background:#e2e8f0;cursor:pointer;}
.tab.active {background:white;}

.chart {border:1px solid var(--border);padding:10px;border-radius:10px;}

.loader {
  display:none;
  text-align:center;
  padding:20px;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/swe.js"></script>
<script src="https://cdn.jsdelivr.net/npm/moment"></script>

</head>

<body>

<header>
<h2>HoraAstro Pro X</h2>
<p>Advanced Vedic Calculation Engine</p>
</header>

<main>

<!-- Sidebar -->
<div>

<div class="card">
<h3>जन्म विवरण</h3>

<input id="name" placeholder="Name">
<input type="datetime-local" id="dt">
<input id="place" placeholder="City">

<button onclick="startCalc()">Generate Kundli</button>

</div>

<div class="card">
<h3>System Status</h3>
<div id="status">Idle</div>
</div>

</div>

<!-- Content -->
<div>

<div class="loader" id="loader">🔄 Calculating...</div>

<div id="output" style="display:none">

<div class="card">
<h3>Panchang</h3>
<div class="grid" id="panchang"></div>
</div>

<div class="tabs">
<button class="tab active" onclick="tab('chart')">Chart</button>
<button class="tab" onclick="tab('dasha')">Dasha</button>
<button class="tab" onclick="tab('analysis')">Analysis</button>
</div>

<div id="chart" class="card tabc">
<div id="chartBox"></div>
</div>

<div id="dasha" class="card tabc" style="display:none">
<div id="dashaBox"></div>
</div>

<div id="analysis" class="card tabc" style="display:none">
<table width="100%" id="table"></table>
</div>

</div>

</div>

</main>

<script>

// ---------- CORE ENGINE ----------

async function startCalc(){

document.getElementById("loader").style.display="block";
document.getElementById("output").style.display="none";
document.getElementById("status").innerText="Processing...";

try{

let dt = document.getElementById("dt").value;
let m = moment(dt);

let jd = swe.swe_julday(
m.year(),m.month()+1,m.date(),
m.hours()+m.minutes()/60 - 5.5,
swe.SE_GREG_CAL
);

swe.swe_set_sid_mode(1);

// planets
let planets = [
{n:"Sun",id:swe.SE_SUN},
{n:"Moon",id:swe.SE_MOON},
{n:"Mars",id:swe.SE_MARS},
{n:"Mercury",id:swe.SE_MERCURY},
{n:"Jupiter",id:swe.SE_JUPITER},
{n:"Venus",id:swe.SE_VENUS},
{n:"Saturn",id:swe.SE_SATURN},
];

let res=[];

planets.forEach(p=>{
let r=swe.swe_calc_ut(jd,p.id,swe.SEFLG_SIDEREAL);
res.push({name:p.n,lon:r.longitude});
});

// Panchang
calcPanchang(res);

// Table
renderTable(res);

// Chart
drawChart(res);

// Dasha
calcDasha(res.find(x=>x.name=="Moon").lon,m);

document.getElementById("loader").style.display="none";
document.getElementById("output").style.display="block";
document.getElementById("status").innerText="Done";

}catch(e){
alert("Error: "+e.message);
}

}

// ---------- PANCHANG ----------

function calcPanchang(p){

let sun=p.find(x=>x.name=="Sun").lon;
let moon=p.find(x=>x.name=="Moon").lon;

let tithi=Math.floor(((moon-sun+360)%360)/12)+1;
let nak=Math.floor(moon/13.33)+1;

document.getElementById("panchang").innerHTML=`
<div class="box">Tithi<br><b>${tithi}</b></div>
<div class="box">Nakshatra<br><b>${nak}</b></div>
`;

}

// ---------- TABLE ----------

function renderTable(p){

let html="<tr><th>Planet</th><th>Degree</th></tr>";

p.forEach(x=>{
html+=`<tr><td>${x.name}</td><td>${x.lon.toFixed(2)}</td></tr>`;
});

document.getElementById("table").innerHTML=html;

}

// ---------- CHART ----------

function drawChart(p){

let svg=`<svg viewBox="0 0 300 300">`;

svg+=`<rect x="0" y="0" width="300" height="300" fill="none" stroke="black"/>`;

p.forEach((x,i)=>{
svg+=`<text x="${50+i*20}" y="150">${x.name}</text>`;
});

svg+="</svg>";

document.getElementById("chartBox").innerHTML=svg;

}

// ---------- DASHA ----------

function calcDasha(moon,m){

let html="";

for(let i=0;i<5;i++){
html+=`<p>Dasha ${i+1} Year ${m.year()+i}</p>`;
}

document.getElementById("dashaBox").innerHTML=html;

}

// ---------- TABS ----------

function tab(id){

document.querySelectorAll(".tabc").forEach(x=>x.style.display="none");
document.getElementById(id).style.display="block";

document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
event.target.classList.add("active");

}

</script>

</body>
</html>
