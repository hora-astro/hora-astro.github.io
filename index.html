<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hora Astro - Premium Kundli</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<nav class="bg-blue-900 p-4 text-white text-center shadow-lg">
    <h1 class="text-2xl font-bold">🔮 HORA ASTRO PREMIUM</h1>
</nav>

<div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-xl shadow-2xl">
    <h2 class="text-xl font-bold mb-6 text-gray-800 border-b pb-2">नया विवरण</h2>
    <div class="space-y-4">
        <input type="text" id="name" placeholder="नाम" class="w-full p-3 border rounded-lg">
        <div class="grid grid-cols-2 gap-2">
            <input type="date" id="dob" class="p-3 border rounded-lg">
            <input type="time" id="tob" class="p-3 border rounded-lg">
        </div>
        <input type="text" id="place" onkeyup="searchLoc(this.value)" placeholder="शहर खोजें..." class="w-full p-3 border rounded-lg" autocomplete="off">
        <div id="suggestions" class="bg-white border hidden max-h-40 overflow-y-auto"></div>
        
        <input type="hidden" id="lat">
        <input type="hidden" id="lon">

        <button onclick="getReport()" class="w-full bg-blue-800 text-white font-bold py-4 rounded-lg hover:bg-blue-700 transition">कुंडली बनाएं</button>
    </div>
</div>

<div id="loader" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center text-white font-bold">गणन जारी है...</div>

<script>
    const API_URL = "https://hemantpurohit27.pythonanywhere.com/calculate";

    async function searchLoc(q) {
        if (q.length < 3) return;
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=5`);
        const data = await res.json();
        const box = document.getElementById('suggestions');
        box.innerHTML = ''; box.style.display = 'block';
        data.forEach(item => {
            let div = document.createElement('div');
            div.className = "p-2 hover:bg-gray-100 cursor-pointer border-b text-sm";
            div.innerText = item.display_name;
            div.onclick = () => {
                document.getElementById('place').value = item.display_name.split(',')[0];
                document.getElementById('lat').value = item.lat;
                document.getElementById('lon').value = item.lon;
                box.style.display = 'none';
            };
            box.appendChild(div);
        });
    }

    async function getReport() {
        const lat = document.getElementById('lat').value;
        if(!lat) { alert("कृपया लिस्ट में से शहर चुनें!"); return; }

        document.getElementById('loader').classList.remove('hidden');
        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name: document.getElementById('name').value,
                    date: document.getElementById('dob').value,
                    time: document.getElementById('tob').value,
                    place: document.getElementById('place').value,
                    lat: lat,
                    lon: document.getElementById('lon').value
                })
            });
            const result = await res.json();
            if(result.status === 'success') {
                localStorage.setItem('astro_data', JSON.stringify(result));
                window.location.href = 'report.html';
            } else { alert("सर्वर एरर: " + result.message); }
        } catch (e) { alert("सर्वर से कनेक्ट नहीं हो सका!"); }
        finally { document.getElementById('loader').classList.add('hidden'); }
    }
</script>
</body>
</html>
