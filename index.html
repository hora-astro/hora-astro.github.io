<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Fortune Pro Entry</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fffcf5; padding: 20px; display: flex; justify-content: center; }
        .box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; border-top: 8px solid #800000; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { background: #800000; color: white; font-weight: bold; cursor: pointer; border: none; }
        #city-list { position: absolute; background: white; border: 1px solid #ddd; width: 390px; z-index: 100; display: none; max-height: 200px; overflow-y: auto; }
        .city-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="text-align:center; color:#800000;">ज्योतिष सॉफ्टवेयर</h2>
        <input type="text" id="name" placeholder="नाम">
        <input type="date" id="date">
        <input type="time" id="time">
        <div style="position:relative;">
            <input type="text" id="city" placeholder="शहर खोजें..." oninput="searchCity(this.value)">
            <div id="city-list"></div>
        </div>
        <div style="display:flex; gap:10px;">
            <input type="text" id="lat" placeholder="Latitude">
            <input type="text" id="lon" placeholder="Longitude">
        </div>
        <select id="ayan">
            <option value="Lahiri">NC Lahiri</option>
            <option value="KP">KP Ayanamsa</option>
            <option value="Raman">B.V. Raman</option>
        </select>
        <button onclick="process()">कुंडली बनाएँ</button>
    </div>
    <script>
        async function searchCity(q) {
            if(q.length < 3) return;
            const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}`);
            const data = await r.json();
            let html = "";
            data.slice(0,5).forEach(i => {
                html += `<div class="city-item" onclick="setCity('${i.display_name}',${i.lat},${i.lon})">${i.display_name}</div>`;
            });
            document.getElementById('city-list').innerHTML = html;
            document.getElementById('city-list').style.display = 'block';
        }
        function setCity(n, lt, ln) {
            document.getElementById('city').value = n;
            document.getElementById('lat').value = lt;
            document.getElementById('lon').value = ln;
            document.getElementById('city-list').style.display = 'none';
        }
        function process() {
            const data = {
                custName: document.getElementById('name').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                city: document.getElementById('city').value,
                lat: document.getElementById('lat').value,
                lon: document.getElementById('lon').value,
                ayan_type: document.getElementById('ayan').value
            };
            localStorage.setItem('kundliInput', JSON.stringify(data));
            window.location.href = "report.html";
        }
</script>
</body>
</html>
