<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><title>Detailed Report</title>
<style>
    body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; padding: 20px; }
    .page { background: white; max-width: 950px; margin: auto; padding: 40px; border: 2px solid #800000; }
    .pan-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #fff8f0; border: 1px solid #800000; padding: 15px; margin: 20px 0; font-size: 13px; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
    .c-box { border: 1px solid #800000; padding: 10px; text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background: #800000; color: white; }
    .pred-box { background: #fffdf2; border-left: 6px solid #daa520; padding: 20px; margin-top: 30px; }
</style></head>
<body>
    <div class="page">
        <h1 style="text-align:center; color:#800000;">॥ श्री गणेशाय नमः ॥</h1>
        <p style="text-align:center;"><b>प्रयुक्त अयनांश:</b> <span id="ayan-info"></span></p>
        <div class="pan-grid" id="pan"></div>
        <div class="charts">
            <div class="c-box"><b>लग्न कुंडली (D1)</b><div id="d1"></div></div>
            <div class="c-box"><b>नवांश कुंडली (D9)</b><div id="d9"></div></div>
        </div>
        <table><thead><tr><th>ग्रह</th><th>डिग्री</th><th>नक्षत्र</th><th>D1 भाव</th><th>D9 राशि</th></tr></thead><tbody id="tbody"></tbody></table>
        <h3 style="color:#800000; border-bottom: 2px solid #800000; margin-top:40px;">📅 विंशोत्तरी अंतर्दशा (भुक्त शेष सहित)</h3>
        <table><thead><tr><th>महादशा</th><th>अंतर्दशा स्वामी</th><th>समाप्ति तिथि</th></tr></thead><tbody id="dbody"></tbody></table>
        <div class="pred-box"><h3>✨ विस्तृत फलादेश (JSON)</h3><div id="preds"></div></div>
    </div>
    <script>
        window.onload = async () => {
            const k = JSON.parse(localStorage.getItem('kData'));
            const res = await fetch('https://hemantpurohit27.pythonanywhere.com/calculate', {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(k)
            });
            const data = await res.json();
            document.getElementById('ayan-info').innerText = data.ayan;
            const p = data.pan;
            document.getElementById('pan').innerHTML = `<div><b>तिथि:</b> ${p.tithi}</div><div><b>नक्षत्र:</b> ${p.naks}</div><div><b>योग:</b> ${p.yoga}</div><div><b>करण:</b> ${p.karan}</div><div><b>इष्टकाल:</b> ${p.ishtakal}</div><div><b>गण:</b> ${p.gan}</div><div><b>योनि:</b> ${p.yoni}</div><div><b>नाड़ी:</b> ${p.nadi}</div><div><b>वर्ण:</b> ${p.varna}</div><div><b>वश्य:</b> ${p.vashya}</div><div><b>वैर:</b> ${p.vair}</div><div><b>मैत्री:</b> ${p.maitri}</div><div><b>दोष:</b> ${p.dosha}</div><div><b>भकूट:</b> ${p.bhakoot}</div>`;
            
            let h="", pr="", ds="";
            data.planets.forEach(pl => {
                h += `<tr><td>${pl.name}</td><td>${pl.deg}</td><td>${pl.naks}</td><td>${pl.h}</td><td>${pl.d9_r}</td></tr>`;
                pr += `<p><b>${pl.name}:</b> ${pl.pred}</p>`;
            });
            data.dasha.forEach(d => ds += `<tr><td>${d.ml}</td><td>${d.al}</td><td>${d.ed}</td></tr>`);
            document.getElementById('tbody').innerHTML = h; document.getElementById('dbody').innerHTML = ds; document.getElementById('preds').innerHTML = pr;

            draw('d1', data.l1, data.planets, 'h');
            draw('d9', data.l9, data.planets, 'd9_h');
        };
        function draw(id, asc, planets, key) {
            const pos = {1:[100,65], 2:[50,35], 3:[20,65], 4:[60,105], 5:[20,145], 6:[50,180], 7:[100,145], 8:[150,180], 9:[185,145], 10:[145,105], 11:[185,65], 12:[150,35]};
            let s = `<svg viewBox="0 0 200 200" width="100%"><path d="M0 0 L200 0 L200 200 L0 200 Z M0 0 L200 200 M200 0 L0 200 M100 0 L0 100 L100 200 L200 100 Z" fill="none" stroke="maroon" stroke-width="1.2"/>`;
            for(let i=1; i<=12; i++) {
                let r = (asc + i - 2) % 12 + 1;
                s += `<text x="${pos[i][0]}" y="${pos[i][1]}" font-size="12" fill="maroon" font-weight="bold" text-anchor="middle">${r}</text>`;
                let pNames = planets.filter(p => p[key]==i).map(p => p.name.substring(0,2)).join(' ');
                s += `<text x="${pos[i][0]}" y="${pos[i][1]+12}" font-size="8" text-anchor="middle" fill="#333">${pNames}</text>`;
            }
            document.getElementById(id).innerHTML = s + `</svg>`;
        }
</script>
</body>
</html>
