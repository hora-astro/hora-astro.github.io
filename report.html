<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Advanced Kundli Report</title>
    <style>
        :root { --maroon: #800000; --gold: #daa520; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .page { background: white; width: 210mm; margin: auto; padding: 15mm; box-shadow: 0 0 20px rgba(0,0,0,0.2); border: 2px solid var(--maroon); position: relative; }
        .header { text-align: center; border-bottom: 2px double var(--maroon); padding-bottom: 15px; margin-bottom: 20px; }
        .panchang-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #fff8f0; padding: 15px; border: 1px solid var(--maroon); margin-bottom: 20px; font-size: 13px; }
        .panchang-grid div b { color: var(--maroon); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .chart-box { border: 1px solid var(--maroon); padding: 10px; text-align: center; background: #fff; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #999; padding: 8px; text-align: center; }
        th { background: var(--maroon); color: white; }
        .prediction-box { background: #fffdf0; border-left: 5px solid var(--gold); padding: 15px; margin-top: 20px; line-height: 1.6; }
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; justify-content: center; align-items: center; z-index: 1000; font-size: 20px; }
    </style>
</head>
<body>
    <div id="loading">ग्रहों की गणना और फलादेश तैयार हो रहा है...</div>
    
    <div class="page">
        <div class="header">
            <h1 style="margin:0; color:var(--maroon);">॥ कुंडली विश्लेषण ॥</h1>
            <p id="sub_details"></p>
        </div>

        <div class="panchang-grid" id="panchang_data"></div>

        <div class="grid">
            <div class="chart-box"><b>लग्न कुंडली (D1)</b><div id="d1"></div></div>
            <div class="chart-box"><b>नवांश कुंडली (D9)</b><div id="d9"></div></div>
        </div>

        <table>
            <thead><tr><th>ग्रह</th><th>डिग्री</th><th>भाव</th><th>D9 राशि</th></tr></thead>
            <tbody id="pTable"></tbody>
        </table>

        <div class="prediction-box">
            <h3 style="color:var(--maroon); margin-top:0;">✨ महत्वपूर्ण फलादेश (General Predictions)</h3>
            <div id="pred_text"></div>
        </div>

        <h3 style="color:var(--maroon); border-bottom: 1px solid var(--maroon);">📅 विंशोत्तरी महादशा</h3>
        <table id="dashaTable">
            <thead><tr><th>महादशा स्वामी</th><th>प्रारंभ तिथि</th><th>समाप्ति तिथि</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        window.onload = async () => {
            const d = JSON.parse(localStorage.getItem('kundliData'));
            if(!d) { window.location.href="index.html"; return; }

            try {
                const res = await fetch('https://hemantpurohit27.pythonanywhere.com/calculate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(d)
                });
                const data = await res.json();
                if(data.status === 'success') renderUI(data, d);
            } catch(e) { alert("सर्वर त्रुटि! PythonAnywhere चेक करें।"); }
            document.getElementById('loading').style.display = 'none';
        };

        function renderUI(data, input) {
            document.getElementById('sub_details').innerText = `नाम: ${data.name} | जन्म: ${input.date} ${input.time} | स्थान: ${input.city}`;
            
            // पंचांग रेंडर
            const pan = data.panchang;
            document.getElementById('panchang_data').innerHTML = `
                <div><b>नक्षत्र स्वामी:</b> ${pan.nakshetra}</div>
                <div><b>चरण:</b> ${pan.charan}</div>
                <div><b>मंगल दोष:</b> ${pan.manglik}</div>
                <div><b>अक्षांश:</b> ${input.lat}</div>
                <div><b>देशांतर:</b> ${input.lon}</div>
            `;

            // ग्रह तालिका
            let p_html = "";
            data.planets.forEach(p => {
                p_html += `<tr><td><b>${p.name}</b></td><td>${p.deg}</td><td>${p.house}</td><td>${p.d9_sign}</td></tr>`;
            });
            document.getElementById('pTable').innerHTML = p_html;

            // महादशा
            let d_html = "";
            data.dashas.forEach(dash => {
                d_html += `<tr><td>${dash.lord}</td><td>${dash.start}</td><td>${dash.end}</td></tr>`;
            });
            document.getElementById('dashaTable').querySelector('tbody').innerHTML = d_html;

            // बेसिक फलादेश (Logic based on Ascendant/Lagna)
            const signs = ["", "मेष", "वृषभ", "मिथुन", "कर्क", "सिंह", "कन्या", "तुला", "वृश्चिक", "धनु", "मकर", "कुंभ", "मीन"];
            let pred = `<b>लग्न का फल:</b> आपका लग्न <b>${signs[data.lagna]}</b> है। `;
            if(data.panchang.manglik.includes("हाँ")) pred += "<br><b>मंगल विचार:</b> आपकी कुंडली में मांगलिक दोष बन रहा है, जो विवाह में देरी या वैचारिक मतभेद का संकेत देता है। ";
            
            document.getElementById('pred_text').innerHTML = pred;

            // चार्ट ड्राइंग
            drawChart('d1', data.lagna, data.planets, 'house');
            drawChart('d9', data.d9_lagna, data.planets, 'd9_sign');
        }

        function drawChart(id, asc, planets, key) {
            const pos = {1:[100,65], 2:[50,35], 3:[20,65], 4:[60,105], 5:[20,145], 6:[50,180], 7:[100,145], 8:[150,180], 9:[185,145], 10:[145,105], 11:[185,65], 12:[150,35]};
            let s = `<svg viewBox="0 0 200 210" width="100%"><path d="M0 10 L200 10 L200 200 L0 200 Z M0 10 L200 200 M200 10 L0 200 M100 10 L0 105 L100 200 L200 105 Z" fill="none" stroke="maroon" stroke-width="1.2"/>`;
            for(let i=1; i<=12; i++) {
                let sign = (asc + i - 2) % 12 + 1;
                s += `<text x="${pos[i][0]}" y="${pos[i][1]}" font-size="12" fill="maroon" font-weight="bold" text-anchor="middle">${sign}</text>`;
                let pNames = planets.filter(p => (key==='house'?p.house:p.d9_sign) == i).map(p => p.name.substring(0,2)).join(' ');
                s += `<text x="${pos[i][0]}" y="${pos[i][1]+15}" font-size="8" text-anchor="middle" fill="#333">${pNames}</text>`;
            }
            document.getElementById(id).innerHTML = s + `</svg>`;
        }
    </script>
</body>
</html>
