<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Professional Horoscope Report</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #fdf6e3; padding: 20px; }
        .page { background: white; max-width: 900px; margin: auto; padding: 40px; border: 2px solid #800000; box-shadow: 0 0 20px rgba(0,0,0,0.2); }
        .panchang-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #fff8f0; border: 1px solid #800000; padding: 15px; margin: 20px 0; font-size: 14px; }
        .chart-container { display: flex; gap: 20px; margin-bottom: 30px; }
        .c-box { flex: 1; border: 1px solid #800000; padding: 10px; text-align: center; background: white; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background: #800000; color: white; }
        .prediction-box { background: #fffde7; padding: 20px; border-left: 5px solid #800000; margin-top: 20px; line-height: 1.6; }
        #loader { font-size: 24px; text-align: center; color: #800000; margin-top: 100px; }
        .error-btn { background: #800000; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="loader">🪐 ग्रहों की गणना की जा रही है...</div>
    
    <div class="page" id="report" style="display:none;">
        <h1 style="text-align:center; color:#800000; margin:0;">॥ जन्म कुंडली विवरण ॥</h1>
        <p style="text-align:center;"><b>अयनांश:</b> <span id="ayan-info"></span></p>

        <div class="panchang-grid" id="pan-data"></div>

        <div class="chart-container">
            <div class="c-box"><b>लग्न कुंडली (D1)</b><div id="d1"></div></div>
            <div class="c-box"><b>नवांश कुंडली (D9)</b><div id="d9"></div></div>
        </div>

        <table>
            <thead><tr><th>ग्रह</th><th>अंश (Degree)</th><th>नक्षत्र</th><th>भाव</th><th>D9 राशि</th></tr></thead>
            <tbody id="p-body"></tbody>
        </table>

        <h3 style="color:#800000; border-bottom: 2px solid #800000;">📅 विंशोत्तरी अंतर्दशा (भुक्त शेष सहित)</h3>
        <table>
            <thead><tr><th>महादशा</th><th>अंतर्दशा</th><th>समाप्ति तिथि</th></tr></thead>
            <tbody id="d-body"></tbody>
        </table>

        <div class="prediction-box">
            <h3 style="margin-top:0;">✨ विस्तृत फलादेश (Capture from Data Files)</h3>
            <div id="preds"></div>
        </div>
    </div>

    <script>
        window.onload = async () => {
            // 1. डेटा प्राप्त करना
            const input = JSON.parse(localStorage.getItem('kundliInput') || localStorage.getItem('kData'));
            if(!input) { 
                document.getElementById('loader').innerText = "डाटा नहीं मिला! कृपया मुख्य पेज से विवरण भरें।"; 
                return; 
            }

            try {
                // 2. API कॉल (CORS सुरक्षा के साथ)
                const res = await fetch('https://hemantpurohit27.pythonanywhere.com/calculate', {
                    method: 'POST',
                    mode: 'cors', // इसे जोड़ना जरूरी है
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(input)
                });

                if (!res.ok) {
                    throw new Error(`HTTP Error: ${res.status}`);
                }

                const data = await res.json();
                
                if(data.status === "success") {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('report').style.display = 'block';
                    document.getElementById('ayan-info').innerText = data.ayan || 'Lahiri';

                    // 3. पंचांग रेंडरिंग
                    const p = data.pan;
                    document.getElementById('pan-data').innerHTML = `
                        <div><b>तिथि:</b> ${p.tithi}</div><div><b>नक्षत्र:</b> ${p.naks}</div>
                        <div><b>योग:</b> ${p.yoga}</div><div><b>करण:</b> ${p.karan}</div>
                        <div><b>इष्टकाल:</b> ${p.ishtakal}</div><div><b>गण:</b> ${p.gan}</div>
                        <div><b>योनि:</b> ${p.yoni}</div><div><b>नाड़ी:</b> ${p.nadi}</div>
                        <div><b>वर्ण:</b> ${p.varna}</div><div><b>वश्य:</b> ${p.vashya}</div>
                        <div><b>वैर:</b> ${p.vair}</div><div><b>मैत्री:</b> ${p.maitri}</div>
                        <div><b>दोष:</b> ${p.dosha}</div><div><b>भकूट:</b> ${p.bhakoot}</div>
                    `;

                    // 4. ग्रह और फलादेश रेंडरिंग
                    let pRows = "", predHtml = "";
                    data.planets.forEach(pl => {
                        pRows += `<tr><td>${pl.name}</td><td>${pl.deg}</td><td>${pl.naks}</td><td>${pl.h}</td><td>${pl.d9_r}</td></tr>`;
                        predHtml += `<p><b>${pl.name}:</b> ${pl.pred}</p>`;
                    });
                    document.getElementById('p-body').innerHTML = pRows;
                    document.getElementById('preds').innerHTML = predHtml;

                    // 5. विंशोत्तरी दशा रेंडरिंग
                    let dRows = "";
                    data.dasha.forEach(ds => {
                        dRows += `<tr><td>${ds.ml}</td><td>${ds.al}</td><td>${ds.ed}</td></tr>`;
                    });
                    document.getElementById('d-body').innerHTML = dRows;

                    // 6. कुंडली ड्रॉ (D1 & D9)
                    drawKundli('d1', data.l1, data.planets, 'h');
                    
                    // D9 के लिए दूसरे ग्रह (चंद्रमा) की नवांश राशि को आधार मानकर या सीधे राशि भेजकर
                    const d9_asc = data.planets[0].d9_r; // सूर्य की नवांश राशि को उदाहरण मानकर
                    drawKundli('d9', d9_asc, data.planets, 'd9_r'); 

                } else {
                    document.getElementById('loader').innerHTML = `सर्वर एरर: ${data.message} <br> <button class="error-btn" onclick="location.reload()">दोबारा प्रयास करें</button>`;
                }
            } catch (e) {
                console.error("Fetch error:", e);
                document.getElementById('loader').innerHTML = `
                    <div style="color:red; font-weight:bold;">कनैक्शन फेल!</div>
                    <p style="font-size:16px;">ऐसा ब्राउज़र की सुरक्षा (CORS) के कारण हो सकता है।</p>
                    <button class="error-btn" onclick="location.reload()">Reload Page</button>
                `;
            }
        };

        // कुंडली ड्रॉ करने का फंक्शन
        function drawKundli(id, asc, planets, key) {
            const pos = {
                1:[100,70], 2:[50,40], 3:[25,70], 4:[65,110], 5:[25,150], 6:[50,180], 
                7:[100,150], 8:[150,180], 9:[175,150], 10:[135,110], 11:[175,70], 12:[150,40]
            };
            
            let svg = `<svg viewBox="0 0 200 200" width="100%">
                <path d="M0 0 L200 0 L200 200 L0 200 Z M0 0 L200 200 M200 0 L0 200 M100 0 L0 100 L100 200 L200 100 Z" fill="none" stroke="#800000" stroke-width="1.5"/>`;
            
            for(let i=1; i<=12; i++) {
                // राशि गणना
                let r = (asc + i - 2) % 12 + 1;
                svg += `<text x="${pos[i][0]}" y="${pos[i][1]}" font-size="10" fill="#800000" font-weight="bold" text-anchor="middle">${r}</text>`;
                
                // उस भाव में कौन से ग्रह हैं?
                let pNames = planets.filter(p => p[key] == i).map(p => p.name.substring(0,2)).join(' ');
                if(pNames) {
                    svg += `<text x="${pos[i][0]}" y="${pos[i][1]+15}" font-size="8" fill="#333" text-anchor="middle">${pNames}</text>`;
                }
            }
            document.getElementById(id).innerHTML = svg + `</svg>`;
        }
    </script>
</body>
</html>
