<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Professional Kundli Report</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .report-container { background: white; max-width: 950px; margin: auto; padding: 40px; border: 2px solid #800000; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        .panchang-grid { display: grid; grid-template-columns: repeat(4, 1fr); background: #fff8f0; border: 1px solid #800000; margin: 20px 0; font-size: 13px; }
        .panchang-grid div { padding: 12px; border: 0.5px solid #ebd5b3; }
        .panchang-grid b { color: #800000; }
        .chart-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .chart-box { border: 1px solid #800000; text-align: center; padding: 10px; background: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 25px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background: #800000; color: white; }
        .high { color: #008000; font-weight: bold; } /* उच्च ग्रह - हरा */
        .low { color: #ff0000; font-weight: bold; }   /* नीच ग्रह - लाल */
        .prediction-area { background: #fffcf0; border-left: 6px solid #daa520; padding: 20px; margin-top: 30px; font-size: 15px; line-height: 1.7; }
    </style>
</head>
<body>

<div class="report-container">
    <h1 style="text-align:center; color:#800000;">॥ कुंडली विश्लेषण ॥</h1>
    
    <div class="panchang-header" style="display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid #800000; padding: 10px; font-size: 14px; background: #fffcf0;">
        <div><b>नक्षत्र:</b> <span id="naks-val"></span></div>
        <div><b>तिथि:</b> <span id="tithi-val"></span></div>
        <div><b>इष्टकाल:</b> <span id="ishtakal-val"></span></div>
        <div><b>योग:</b> <span id="yoga-val"></span></div>
        <div><b>करण:</b> बव</div>
        <div><b>पक्ष:</b> शुक्ल</div>
        <div><b>योनि:</b> <span id="yoni-val"></span></div>
        <div><b>गण:</b> <span id="gan-val"></span></div>
        <div><b>नाड़ी:</b> <span id="nadi-val"></span></div>
    </div>

    <div class="charts-row" style="display: flex; gap: 20px; margin-top: 20px;">
        <div id="d1-box" class="chart-box"><h3>लग्न कुंडली (D1)</h3><div id="d1"></div></div>
        <div id="d9-box" class="chart-box"><h3>नवांश कुंडली (D9)</h3><div id="d9"></div></div>
    </div>

    <table style="width:100%; border-collapse: collapse; margin-top: 20px;">
        <tr style="background:#800000; color:white;">
            <th>ग्रह</th><th>डिग्री</th><th>नक्षत्र</th><th>भाव</th><th>D1 स्थिति</th><th>D9 स्थिति</th>
        </tr>
        <tbody id="p-table"></tbody>
    </table>

    <div class="dasha-section" style="margin-top:20px; border-top: 2px solid #800000; padding-top:10px;">
        <h3>महादशा एवं अंतर्दशा</h3>
        <div id="dasha-list"></div>
    </div>
</div>

<script>
    // डेटा रेंडरिंग के समय स्टेटस चेक करें
    function renderPlanets(planets) {
        let html = "";
        planets.forEach(p => {
            let d1_class = p.d1_status === 'high' ? 'style="color:green; font-weight:bold"' : (p.d1_status === 'low' ? 'style="color:red"' : '');
            let d9_class = p.d9_status === 'high' ? 'style="color:green; font-weight:bold"' : (p.d9_status === 'low' ? 'style="color:red"' : '');
            
            html += `<tr>
                <td>${p.name}</td><td>${p.deg}</td><td>${p.naks}</td><td>${p.house}</td>
                <td ${d1_class}>${p.d1_status}</td><td ${d9_class}>${p.d9_status}</td>
            </tr>`;
        });
        document.getElementById('p-table').innerHTML = html;
    }
</script>
</body>
</html>
