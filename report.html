<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FortuneWithStars Pro - Ultimate Astrology</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --maroon: #800000; --gold: #daa520; --bg: #fffcf5; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #eee; margin: 0; }
        .toolbar { background: white; padding: 15px; border-bottom: 4px solid var(--maroon); display: flex; gap: 10px; justify-content: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2); flex-wrap: wrap; }
        input, button { padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
        button { cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-gen { background: var(--maroon); color: white; border: none; }
        .btn-pdf { background: #27ae60; color: white; border: none; }
        
        .pdf-page { width: 210mm; min-height: 297mm; margin: 20px auto; background: white; padding: 15mm; box-sizing: border-box; box-shadow: 0 0 15px rgba(0,0,0,0.3); position: relative; border: 2px solid var(--maroon); }
        .header { text-align: center; border-bottom: 3px double var(--maroon); padding-bottom: 10px; margin-bottom: 20px; }
        
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
        .chart-box { border: 1.5px solid var(--maroon); padding: 10px; text-align: center; background: #fff; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #999; padding: 10px; text-align: center; font-size: 13px; }
        th { background: var(--maroon); color: white; }
        .high { color: #27ae60; font-weight: bold; }
        .low { color: #e74c3c; font-weight: bold; }
        
        .dasha-block { margin-top: 15px; border: 1px solid #ddd; }
        .dasha-header { background: #f8f8f8; padding: 10px; font-weight: bold; border-bottom: 1px solid #ddd; color: var(--maroon); }
        .antardasha-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #ddd; }
        .antardasha-item { background: white; padding: 8px; font-size: 11px; }

        .prediction-box { background: #fffdf0; border-left: 5px solid var(--gold); padding: 15px; margin-top: 20px; font-size: 14px; line-height: 1.7; text-align: justify; }
        #loader { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: white; padding: 30px; border-radius: 10px; z-index: 2000; text-align: center; }
    </style>
</head>
<body>

<div id="loader">🪐 <b>ग्रहों की गणना और फलादेश तैयार किया जा रहा है...</b><br>कृपया प्रतीक्षा करें।</div>

<div class="toolbar">
    <input type="text" id="custName" value="हेमंत पुरोहित" placeholder="नाम">
    <input type="date" id="dob" value="1980-03-27">
    <input type="time" id="tob" value="10:30">
    <button class="btn-gen" onclick="generate()">कुंडली बनाएँ</button>
    <button class="btn-pdf" onclick="downloadPDF()">PDF डाउनलोड</button>
</div>

<div id="printArea"></div>

<script>
async function generate() {
    document.getElementById('loader').style.display = 'block';
    const payload = {
        date: document.getElementById('dob').value,
        time: document.getElementById('tob').value,
        lat: 23.32, lon: 74.26
    };

    try {
        const res = await fetch('https://hemantpurohit27.pythonanywhere.com/calculate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if(data.status === 'success') renderUI(data);
        else alert("Error: " + data.message);
    } catch(e) { 
        alert("सर्वर से संपर्क विफल! कृपया PythonAnywhere चेक करें।");
    } finally {
        document.getElementById('loader').style.display = 'none';
    }
}

function renderUI(data) {
    let html = "";
    
    // PAGE 1: Basic & Charts
    html += `<div class="pdf-page">
        <div class="header">
            <h1 style="margin:0; color:var(--maroon);">॥ FortuneWithStars वृहद कुंडली ॥</h1>
            <p>नाम: <b>${document.getElementById('custName').value}</b> | अयनांश: <b>${data.ayan}</b></p>
        </div>
        <div class="chart-grid">
            <div class="chart-box"><b>लग्न कुंडली (D1)</b><div id="d1_svg"></div></div>
            <div class="chart-box"><b>नवांश कुंडली (D9)</b><div id="d9_svg"></div></div>
        </div>
        <table>
            <tr><th>ग्रह</th><th>अंश</th><th>नक्षत्र</th><th>भाव</th><th>D1 स्थिति</th><th>D9 स्थिति</th></tr>`;
    
    data.planets.forEach(p => {
        html += `<tr>
            <td><b>${p.name}</b></td><td>${p.deg}</td><td>${p.naks}</td><td>${p.house}</td>
            <td class="${p.status_d1=='उच्च'?'high':(p.status_d1=='नीच'?'low':'')}">${p.status_d1}</td>
            <td class="${p.status_d9=='उच्च'?'high':(p.status_d9=='नीच'?'low':'')}">${p.status_d9}</td>
        </tr>`;
    });
    html += `</table>
        <div class="prediction-box">
            <h3 style="margin-top:0; color:var(--maroon);">✨ ज्योतिषीय फलादेश</h3>
            ${data.planets.map(p => `<p><b>${p.name}:</b> ${p.prediction}</p>`).join('')}
        </div>
    </div>`;

    // PAGE 2: Dashas
    html += `<div class="pdf-page">
        <h2 style="color:var(--maroon); border-bottom: 2px solid var(--maroon);">विंशोत्तरी महादशा एवं अंतर्दशा</h2>`;
    
    data.dashas.forEach(d => {
        html += `<div class="dasha-block">
            <div class="dasha-header">${d.lord} महादशा (${d.start} से ${d.end})</div>
            <div class="antardasha-grid">
                ${d.antardasha.map(ad => `<div class="antardasha-item"><b>${d.lord}-${ad.lord}</b><br><span style="color:var(--gold)">${ad.end}</span></div>`).join('')}
            </div>
        </div>`;
    });
    html += `</div>`;

    document.getElementById('printArea').innerHTML = html;

    // Drawing Charts
    setTimeout(() => {
        drawChart('d1_svg', data.lagna, data.planets, 'house');
        drawChart('d9_svg', data.d9_lagna, data.planets, 'd9');
    }, 500);
}

function drawChart(id, asc, planets, mode) {
    const coords = {1:[100,70], 2:[50,40], 3:[25,70], 4:[65,110], 5:[25,150], 6:[50,180], 7:[100,150], 8:[150,180], 9:[175,150], 10:[135,110], 11:[175,70], 12:[150,40]};
    let svg = `<svg viewBox="0 0 200 200" width="100%"><path d="M0 0 L200 0 L200 200 L0 200 Z M0 0 L200 200 M200 0 L0 200 M100 0 L0 100 L100 200 L200 100 Z" fill="none" stroke="maroon" stroke-width="2"/>`;
    
    for (let i = 1; i <= 12; i++) {
        let sign = (asc + i - 2) % 12 + 1;
        svg += `<text x="${coords[i][0]}" y="${coords[i][1]}" fill="maroon" font-weight="bold" font-size="12" text-anchor="middle">${sign}</text>`;
        
        let list = (mode === 'house') ? planets.filter(p => p.house === i) : planets.filter(p => p.d9_sign === sign);
        list.forEach((p, idx) => {
            svg += `<text x="${coords[i][0]}" y="${coords[i][1]+10+(idx*8)}" font-size="7" fill="#333" font-weight="bold" text-anchor="middle">${p.name.substring(0,2)}</text>`;
        });
    }
    document.getElementById(id).innerHTML = svg + `</svg>`;
}

async function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'a4');
    const pages = document.querySelectorAll('.pdf-page');
    for (let i = 0; i < pages.length; i++) {
        const canvas = await html2canvas(pages[i], { scale: 2 });
        if (i > 0) doc.addPage();
        doc.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 210, 297);
    }
    doc.save(`${document.getElementById('custName').value}_Kundli.pdf`);
}
</script>
</body>
</html>
