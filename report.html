<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Report</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; padding: 20px; }
        .container { background: white; max-width: 900px; margin: auto; padding: 30px; border: 2px solid #800000; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 2px solid #800000; padding-bottom: 10px; }
        .pan-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #fff8f0; padding: 15px; border: 1px solid #800000; margin: 20px 0; font-size: 13px; }
        .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chart-box { border: 1px solid #800000; padding: 10px; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px; }
        th { background: #800000; color: white; }
        .pred-section { margin-top: 30px; padding: 20px; background: #fffdf2; border-left: 6px solid #daa520; }
        #loader { text-align: center; font-size: 20px; color: #800000; padding: 50px; }
    </style>
</head>
<body>
    <div id="loader">गणना की जा रही है, कृपया प्रतीक्षा करें...</div>
    <div class="container" id="report" style="display:none;">
        <div class="header">
            <h1 style="margin:0;">॥ विस्तृत जन्म कुंडली ॥</h1>
            <p id="person-info"></p>
            <p><b>अयनांश:</b> <span id="ayan-val"></span></p>
        </div>
        <div class="pan-grid" id="pan-data"></div>
        <div class="charts">
            <div class="chart-box"><b>लग्न कुंडली (D1)</b><div id="d1"></div></div>
            <div class="chart-box"><b>नवांश कुंडली (D9)</b><div id="d9"></div></div>
        </div>
        <table>
            <thead><tr><th>ग्रह</th><th>अंश</th><th>नक्षत्र</th><th>भाव</th><th>D9 राशि</th></tr></thead>
            <tbody id="p-body"></tbody>
        </table>
        <h3 style="color:#800000; border-bottom: 2px solid #800000; margin-top:40px;">📅 विंशोत्तरी दशा</h3>
        <table>
            <thead><tr><th>महादशा</th><th>अंतर्दशा</th><th>समाप्ति तिथि</th></tr></thead>
            <tbody id="d-body"></tbody>
        </table>
        <div class="pred-section">
            <h3>✨ फलादेश (Predictions)</h3>
            <div id="preds"></div>
        </div>
    </div>
    <script>
        window.onload = async () => {
            const input = JSON.parse(localStorage.getItem('kundliInput'));
            if(!input) { alert("Data not found!"); return; }

            try {
                const response = await fetch('https://hemantpurohit27.pythonanywhere.com/calculate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(input)
                });
                
                const data = await response.json();
                if(data.status === "success") {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('report').style.display = 'block';
                    
                    document.getElementById('person-info').innerText = `${data.name} | ${input.date} | ${input.time} | ${input.city}`;
                    document.getElementById('ayan-val').innerText = data.ayan;
                    
                    const p = data.pan;
                    document.getElementById('pan-data').innerHTML = `
                        <div><b>तिथि:</b> ${p.tithi}</div><div><b>नक्षत्र:</b> ${p.naks}</div><div><b>योग:</b> ${p.yoga}</div><div><b>करण:</b> ${p.karan}</div>
                        <div><b>इष्टकाल:</b> ${p.ishtakal}</div><div><b>गण:</b> ${p.gan}</div><div><b>योनि:</b> ${p.yoni}</div><div><b>नाड़ी:</b> ${p.nadi}</div>
                        <div><b>वर्ण:</b> ${p.varna}</div><div><b>वश्य:</b> ${p.vashya}</div><div><b>वैर:</b> ${p.vair}</div><div><b>मैत्री:</b> ${p.maitri}</div>
                        <div><b>दोष:</b> ${p.dosha}</div><div><b>भकूट:</b> ${p.bhakoot}</div>`;
                    
                    let pRows = "", predHtml = "", dRows = "";
                    data.planets.forEach(pl => {
                        pRows += `<tr><td>${pl.name}</td><td>${pl.deg}</td><td>${pl.naks}</td><td>${pl.h}</td><td>${pl.d9_r}</td></tr>`;
                        predHtml += `<p><b>${pl.name}:</b> ${pl.pred}</p>`;
                    });
                    data.dasha.forEach(ds => {
                        dRows += `<tr><td>${ds.ml}</td><td>${ds.al}</td><td>${ds.ed}</td></tr>`;
                    });

                    document.getElementById('p-body').innerHTML = pRows;
                    document.getElementById('d-body').innerHTML = dRows;
                    document.getElementById('preds').innerHTML = predHtml;

                    drawChart('d1', data.l1, data.planets, 'h');
                    drawChart('d9', data.l9, data.planets, 'd9_h');
                } else {
                    document.getElementById('loader').innerText = "Error: " + data.message;
                }
            } catch (err) {
                document.getElementById('loader').innerText = "सर्वर से कनेक्ट नहीं हो सका। कृपया चेक करें कि Backend रनिंग में है।";
            }
        };

        function drawChart(divId, ascSign, planets, houseKey) {
            const positions = {
                1:[100,65], 2:[50,35], 3:[20,65], 4:[60,105], 5:[20,145], 6:[50,180],
                7:[100,145], 8:[150,180], 9:[185,145], 10:[145,105], 11:[185,65], 12:[150,35]
            };
            let svg = `<svg viewBox="0 0 200 200" width="100%"><path d="M0 0 L200 0 L200 200 L0 200 Z M0 0 L200 200 M200 0 L0 200 M100 0 L0 100 L100 200 L200 100 Z" fill="none" stroke="maroon" stroke-width="1.2"/>`;
            for(let i=1; i<=12; i++) {
                let signNum = (ascSign + i - 2) % 12 + 1;
                svg += `<text x="${positions[i][0]}" y="${positions[i][1]}" font-size="12" fill="maroon" font-weight="bold" text-anchor="middle">${signNum}</text>`;
                let pNames = planets.filter(p => p[houseKey] == i).map(p => p.name.substring(0,2)).join(' ');
                svg += `<text x="${positions[i][0]}" y="${positions[i][1]+12}" font-size="8" text-anchor="middle" fill="#333">${pNames}</text>`;
            }
            document.getElementById(divId).innerHTML = svg + `</svg>`;
        }
</script>
</body>
</html>
