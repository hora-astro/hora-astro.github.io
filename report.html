<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>FortuneWithStars Pro - Commercial Astrology</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --maroon: #800000; --gold: #daa520; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f0f0; margin: 0; }
        .toolbar { background: white; padding: 15px; border-bottom: 4px solid var(--maroon); display: flex; gap: 10px; justify-content: center; position: sticky; top:0; z-index:100; }
        .pdf-page { width: 210mm; min-height: 297mm; margin: 10px auto; background: white; padding: 15mm; box-sizing: border-box; box-shadow: 0 0 10px rgba(0,0,0,0.1); border: 2px solid var(--maroon); }
        .panchang-bar { display: grid; grid-template-columns: repeat(3, 1fr); background: #fff8f0; border: 1px solid var(--gold); padding: 10px; margin-bottom: 15px; text-align: center; font-weight: bold; }
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chart-box { border: 1px solid var(--maroon); padding: 5px; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #999; padding: 8px; text-align: center; font-size: 12px; }
        th { background: var(--maroon); color: white; }
        .high { color: green; font-weight: bold; }
        .low { color: red; font-weight: bold; }
        .prediction-card { background: #fffdf0; border-left: 5px solid var(--gold); padding: 12px; margin-top: 15px; font-size: 14px; }
        #loading { display:none; position:fixed; top:50%; left:50%; background:rgba(0,0,0,0.8); color:white; padding:20px; z-index:1000; }
    </style>
</head>
<body>

<div id="loading">गणना जारी है...</div>

<div class="toolbar">
    <input type="text" id="custName" value="हेमंत पुरोहित">
    <input type="date" id="dob" value="1980-03-27">
    <input type="time" id="tob" value="10:30">
    <button style="background:var(--maroon); color:white;" onclick="generate()">कुंडली बनाएँ</button>
    <button style="background:green; color:white;" onclick="downloadPDF()">PDF</button>
</div>

<div id="printArea"></div>

<script>
async function generate() {
    document.getElementById('loading').style.display = 'block';
    const payload = {
        date: document.getElementById('dob').value,
        time: document.getElementById('tob').value,
        lat: 23.32, lon: 74.26
    };

    try {
        const res = await fetch('https://hemantpurohit27.pythonanywhere.com/calculate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        renderUI(data);
    } catch(e) { alert("सर्वर त्रुटि!"); }
    finally { document.getElementById('loading').style.display = 'none'; }
}

function renderUI(data) {
    let html = `<div class="pdf-page">
        <h2 style="text-align:center; color:var(--maroon); margin:0;">॥ वृहद ज्योतिषीय विवरण ॥</h2>
        <p style="text-align:center;">जातक: <b>${document.getElementById('custName').value}</b></p>
        
        <div class="panchang-bar">
            <span>तिथि: ${data.pan.tithi}</span>
            <span>नक्षत्र: ${data.pan.naks}</span>
            <span>अयनांश: ${data.pan.ayan}</span>
        </div>

        <div class="chart-grid">
            <div class="chart-box"><b>लग्न कुंडली (D1)</b><div id="d1_svg"></div></div>
            <div class="chart-box"><b>नवांश कुंडली (D9)</b><div id="d9_svg"></div></div>
        </div>

        <table>
            <tr><th>ग्रह</th><th>अंश</th><th>नक्षत्र</th><th>भाव</th><th>D1 स्थिति</th><th>D9 स्थिति</th></tr>`;
    
    data.planets.forEach(p => {
        html += `<tr>
            <td><b>${p.name}</b></td><td>${p.deg}</td><td>${p.naks}</td><td>${p.house}</td>
            <td class="${p.status_d1=='उच्च'?'high':(p.status_d1=='नीच'?'low':'')}">${p.status_d1}</td>
            <td class="${p.status_d9=='उच्च'?'high':(p.status_d9=='नीच'?'low':'')}">${p.status_d9}</td>
        </tr>`;
    });
    html += `</table>

    <div class="prediction-card">
        <h3 style="margin:0; color:var(--maroon);">✨ ज्योतिषीय फलादेश</h3>
        ${data.planets.map(p => `<p style="margin:5px 0;"><b>${p.name}:</b> ${p.prediction}</p>`).join('')}
    </div>
    </div>`;

    document.getElementById('printArea').innerHTML = html;
    drawChart('d1_svg', data.lagna, data.planets, 'house');
    drawChart('d9_svg', data.d9_lagna, data.planets, 'd9');
}

function drawChart(id, asc, planets, mode) {
    const coords = {1:[100,70], 2:[50,40], 3:[25,70], 4:[65,110], 5:[25,150], 6:[50,180], 7:[100,150], 8:[150,180], 9:[175,150], 10:[135,110], 11:[175,70], 12:[150,40]};
    let svg = `<svg viewBox="0 0 200 200" width="100%"><path d="M0 0 L200 0 L200 200 L0 200 Z M0 0 L200 200 M200 0 L0 200 M100 0 L0 100 L100 200 L200 100 Z" fill="none" stroke="maroon" stroke-width="1.5"/>`;
    for (let i = 1; i <= 12; i++) {
        let sign = (asc + i - 2) % 12 + 1;
        svg += `<text x="${coords[i][0]}" y="${coords[i][1]}" fill="maroon" font-size="12" font-weight="bold" text-anchor="middle">${sign}</text>`;
        let list = (mode === 'house') ? planets.filter(p => p.house === i) : planets.filter(p => p.d9_sign === sign);
        list.forEach((p, idx) => {
            svg += `<text x="${coords[i][0]}" y="${coords[i][1]+10+(idx*8)}" font-size="7" fill="#333" text-anchor="middle">${p.name.substring(0,2)}</text>`;
        });
    }
    document.getElementById(id).innerHTML = svg + `</svg>`;
}

async function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'a4');
    const canvas = await html2canvas(document.querySelector('.pdf-page'), { scale: 2 });
    doc.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 210, 297);
    doc.save("Kundli_Report.pdf");
}
</script>
</body>
</html>
