<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Professional Report - FortuneWithStars</title>
    <style>
        body { font-family: 'Segoe UI', serif; margin: 0; background: #eee; }
        .page { background: white; width: 210mm; min-height: 297mm; padding: 20mm; margin: 10mm auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); position: relative; }
        .header { border-bottom: 3px double #800000; text-align: center; padding-bottom: 10px; margin-bottom: 20px; }
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin: 20px 0; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #800000; padding: 10px; text-align: center; }
        th { background: #800000; color: white; }
        .pred-text { line-height: 1.6; color: #333; text-align: justify; }
        @media print { body { background: none; } .page { margin: 0; box-shadow: none; page-break-after: always; } }
    </style>
</head>
<body>
    <div id="output"></div>

    <script>
        window.onload = async () => {
            const k = JSON.parse(localStorage.getItem('kData'));
            const res = await fetch('https://hemantpurohit27.pythonanywhere.com/calculate', {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(k)
            });
            const data = await res.json();
            renderReport(data, k);
        };

        function renderReport(data, k) {
            let html = `
                <div class="page">
                    <div class="header"><h1>FortuneWithStars - ज्योतिष विश्लेषण</h1></div>
                    <p><b>नाम:</b> ${data.name} | <b>स्थान:</b> ${k.city}</p>
                    <p><b>मांगलिक दोष:</b> ${data.manglik}</p>
                    <div class="chart-grid">
                        <div><h3>लग्न कुंडली (D1)</h3><div id="d1_svg"></div></div>
                        <div><h3>नवांश कुंडली (D9)</h3><div id="d9_svg"></div></div>
                    </div>
                </div>
            `;

            // विस्तृत फलादेश लूप (200 पेज के लिए यहाँ अधिक डेटा जोड़ें)
            data.planets.forEach(p => {
                html += `
                    <div class="page">
                        <h2 style="color:#800000; border-bottom:1px solid;">${p.name} का विश्लेषण</h2>
                        <div class="pred-text">
                            <p><b>स्थिति:</b> यह ग्रह आपके ${p.h} भाव में ${p.naks} नक्षत्र में स्थित है।</p>
                            <p>${p.pred}</p>
                            <p><b>नवांश फल:</b> नवांश में यह ${p.d9_h} भाव में होने से फल की तीव्रता को प्रभावित करता है।</p>
                        </div>
                    </div>
                `;
            });

            document.getElementById('output').innerHTML = html;
            draw('d1_svg', data.l1, data.planets, 'h');
            draw('d9_svg', data.l9, data.planets, 'd9_h');
        }

        function draw(id, asc, planets, key) {
            const pos = {1:[100,65], 2:[50,35], 3:[20,65], 4:[60,105], 5:[20,145], 6:[50,180], 7:[100,145], 8:[150,180], 9:[185,145], 10:[145,105], 11:[185,65], 12:[150,35]};
            let s = `<svg viewBox="0 0 200 200" style="border:1px solid #800000"><path d="M0 0 L200 0 L200 200 L0 200 Z M0 0 L200 200 M200 0 L0 200 M100 0 L0 100 L100 200 L200 100 Z" fill="none" stroke="maroon" stroke-width="1.5"/>`;
            for(let i=1; i<=12; i++) {
                let sign = (asc + i - 2) % 12 + 1;
                s += `<text x="${pos[i][0]}" y="${pos[i][1]}" font-size="12" fill="maroon" font-weight="bold" text-anchor="middle">${sign}</text>`;
                let pNames = planets.filter(p => p[key]==i).map(p => p.name.substring(0,2)).join(' ');
                s += `<text x="${pos[i][0]}" y="${pos[i][1]+12}" font-size="9" text-anchor="middle" fill="#333">${pNames}</text>`;
            }
            document.getElementById(id).innerHTML = s + `</svg>`;
        }
    </script>
</body>
</html>
