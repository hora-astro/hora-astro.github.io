<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>ज्योतिषीय रिपोर्ट</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fafafa; padding: 20px; }
        .container { background: white; max-width: 900px; margin: auto; padding: 40px; border: 1px solid #ddd; border-top: 10px solid #800000; }
        .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 30px 0; }
        .chart-box { border: 2px solid #800000; padding: 15px; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: center; }
        th { background: #800000; color: white; }
        .print-btn { background: #27ae60; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
        @media print { .print-btn { display: none; } }
    </style>
</head>
<body>
    <div class="container">
        <button class="print-btn" onclick="window.print()">🖨 प्रिंट रिपोर्ट</button>
        <h1 style="text-align:center; color:#800000;">॥ वृहद कुंडली रिपोर्ट ॥</h1>
        <div id="p-info" style="text-align:center; font-weight:bold; margin-bottom:20px;"></div>

        <div class="charts">
            <div class="chart-box"><b>लग्न कुंडली (D1)</b><div id="d1"></div></div>
            <div class="chart-box"><b>नवांश कुंडली (D9)</b><div id="d9"></div></div>
        </div>

        <table>
            <thead><tr><th>ग्रह</th><th>डिग्री</th><th>नक्षत्र</th><th>भाव (D1)</th></tr></thead>
            <tbody id="tbody"></tbody>
        </table>

        <h3>📅 विंशोत्तरी महादशा (आगामी)</h3>
        <table id="dasha-table"><tr><th>स्वामी</th><th>समाप्ति तिथि</th></tr></table>
    </div>

    <script>
        window.onload = async () => {
            const k = JSON.parse(localStorage.getItem('astroData'));
            const res = await fetch('https://hemantpurohit27.pythonanywhere.com/calculate', {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(k)
            });
            const data = await res.json();
            
            document.getElementById('p-info').innerText = `नाम: ${data.name} | दिनांक: ${k.date} | स्थान: ${k.city.split(',')[0]}`;
            
            let h = "", ds = "";
            data.planets.forEach(p => {
                h += `<tr><td>${p.name}</td><td>${p.deg}</td><td>${p.naks}</td><td>${p.h}</td></tr>`;
            });
            data.dasha.forEach(d => {
                ds += `<tr><td>${d.l}</td><td>${d.ed}</td></tr>`;
            });
            
            document.getElementById('tbody').innerHTML = h;
            document.getElementById('dasha-table').innerHTML += ds;

            drawChart('d1', data.l1, data.planets, 'h');
            drawChart('d9', data.l9, data.planets, 'd9_h');
        };

        function drawChart(id, asc, planets, key) {
            const pos = {1:[100,65], 2:[50,35], 3:[20,65], 4:[60,105], 5:[20,145], 6:[50,180], 7:[100,145], 8:[150,180], 9:[185,145], 10:[145,105], 11:[185,65], 12:[150,35]};
            let svg = `<svg viewBox="0 0 200 200" width="100%"><path d="M0 0 L200 0 L200 200 L0 200 Z M0 0 L200 200 M200 0 L0 200 M100 0 L0 100 L100 200 L200 100 Z" fill="none" stroke="maroon" stroke-width="1.5"/>`;
            for(let i=1; i<=12; i++) {
                let r = (asc + i - 2) % 12 + 1;
                svg += `<text x="${pos[i][0]}" y="${pos[i][1]}" font-size="12" fill="maroon" text-anchor="middle" font-weight="bold">${r}</text>`;
                let pNames = planets.filter(p => p[key]==i).map(p => p.name.substring(0,2)).join(' ');
                svg += `<text x="${pos[i][0]}" y="${pos[i][1]+12}" font-size="8" text-anchor="middle" fill="#333">${pNames}</text>`;
            }
            document.getElementById(id).innerHTML = svg + `</svg>`;
        }
    </script>
</body>
</html>
