<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>FortuneWithStars Pro - Kundli</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --maroon: #800000; --gold: #daa520; --bg-light: #fffcf5; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f0f0; margin: 0; color: #333; }
        .toolbar { background: white; padding: 15px; border-bottom: 4px solid var(--maroon); display: flex; gap: 10px; justify-content: center; position: sticky; top: 0; z-index: 1000; flex-wrap: wrap; }
        input, button { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-gen { background: var(--maroon); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-pdf { background: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; }
        .pdf-page { width: 210mm; min-height: 297mm; margin: 20px auto; background: white; padding: 10mm; box-sizing: border-box; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .page-border { border: 2px solid var(--maroon); min-height: 275mm; padding: 10px; }
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 15px 0; }
        .chart-box { border: 1px solid var(--maroon); padding: 5px; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th, td { border: 1px solid #999; padding: 6px; text-align: center; }
        th { background: var(--maroon); color: white; }
        .high { color: green; font-weight: bold; }
        .low { color: red; font-weight: bold; }
        .dasha-block { margin-top: 10px; border: 1px solid #ddd; }
        .dasha-header { background: #eee; padding: 5px; font-weight: bold; color: var(--maroon); }
        .antardasha-grid { display: grid; grid-template-columns: repeat(3, 1fr); background: #eee; gap: 1px; }
        .antardasha-item { background: white; padding: 5px; font-size: 10px; }
        #loading { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 20px; z-index: 2000; }
    </style>
</head>
<body>

<div id="loading">कुंडली गणना जारी है...</div>

<div class="toolbar">
    <input type="text" id="custName" value="हेमंत पुरोहित">
    <input type="date" id="dob" value="1980-03-27">
    <input type="time" id="tob" value="10:30">
    <input type="text" id="citySearch" value="Banswara" placeholder="जन्म स्थान">
    <input type="hidden" id="lat" value="23.32">
    <input type="hidden" id="lon" value="74.26">
    <button class="btn-gen" onclick="generate()">कुंडली बनाएँ</button>
    <button class="btn-pdf" onclick="downloadPDF()">PDF डाउनलोड</button>
</div>

<div id="printArea"></div>


<script>
const LORDS = ["", "मंगल", "शुक्र", "बुध", "चंद्र", "सूर्य", "बुध", "शुक्र", "मंगल", "गुरु", "शनि", "शनि", "गुरु"];

async function generate() {
    document.getElementById('loading').style.display = 'block';
    const payload = {
        date: document.getElementById('dob').value,
        time: document.getElementById('tob').value,
        lat: document.getElementById('lat').value,
        lon: document.getElementById('lon').value
    };

    try {
        // इसे अपनी फाइल में खोजें और बदलें
        const res = await fetch('https://hemantpurohit27.pythonanywhere.com/calculate', { 
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
    });
        const data = await res.json();
        if(data.status === 'success') renderUI(data);
        else alert("Error: " + data.message);
    } catch(e) {
        alert("सर्वर से संपर्क विफल! PythonAnywhere चेक करें।");
    } finally {
        document.getElementById('loading').style.display = 'none';
    }
}

function renderUI(data) {
    let html = "";
    
    // Page 1
    html += `<div class="pdf-page"><div class="page-border">
        <h2 style="text-align:center; color:var(--maroon); margin:0;">॥ कुंडली विश्लेषण ॥</h2>
        <p style="text-align:center;">नाम: ${document.getElementById('custName').value} | स्थान: ${document.getElementById('citySearch').value}</p>
        <div class="chart-grid">
            <div class="chart-box"><b>लग्न कुंडली (D1)</b><div id="d1_svg"></div></div>
            <div class="chart-box"><b>नवांश कुंडली (D9)</b><div id="d9_svg"></div></div>
        </div>
        <table>
            <thead><tr><th>ग्रह</th><th>डिग्री</th><th>भाव</th><th>D1 स्थिति</th><th>D9 स्थिति</th><th>दृष्टि</th></tr></thead>
            data.planets.forEach(p => {
        html += `<tr>
            <td><b>${p.name}</b></td>
            <td>${p.deg}</td>
            <td>${p.house}</td>
            <td class="${p.status_d1=='उच्च'?'high':(p.status_d1=='नीच'?'low':'')}">${p.status_d1}</td>
            <td class="${p.status_d9=='उच्च'?'high':(p.status_d9=='नीच'?'low':'')}">${p.status_d9}</td>
            <td>${p.aspect}वें भाव पर</td>
        </tr>`;
    });
    
    data.planets.forEach(p => {
        html += `<tr>
            <td><b>${p.name}</b></td>
            <td>${p.deg}</td>
            <td>${p.house}</td>
            <td class="${p.status_d1=='उच्च'?'high':(p.status_d1=='नीच'?'low':'')}">${p.status_d1}</td>
            <td class="${p.status_d9=='उच्च'?'high':(p.status_d9=='नीच'?'low':'')}">${p.status_d9}</td>
            <td>${p.aspect} भाव</td>
        </tr>`;
    });
    
    html += `</tbody></table></div></div>`;

    // Page 2: Dasha
    html += `<div class="pdf-page"><div class="page-border">
        <h3 style="color:var(--maroon); border-bottom:1px solid maroon;">विंशोत्तरी महादशा एवं अंतर्दशा</h3>`;
    data.dashas.forEach(d => {
        html += `<div class="dasha-block">
            <div class="dasha-header">${d.lord} महादशा (${d.start} - ${d.end})</div>
            <div class="antardasha-grid">`;
        d.antardasha.forEach(ad => {
            html += `<div class="antardasha-item">${d.lord}-${ad.lord}<br>${ad.end} तक</div>`;
        });
        html += `</div></div>`;
    });
    html += `</div></div>`;

    document.getElementById('printArea').innerHTML = html;

    // ड्रॉ चार्ट्स
    setTimeout(() => {
        drawNorthChart('d1_svg', data.lagna, data.planets, 'house');
        drawNorthChart('d9_svg', data.d9_lagna, data.planets, 'd9_sign');
    }, 100);
}

function drawNorthChart(divId, ascSign, planets, key) {
    const coords = {1:[100,70], 2:[50,40], 3:[20,70], 4:[60,110], 5:[20,150], 6:[50,185], 7:[100,150], 8:[150,185], 9:[180,150], 10:[140,110], 11:[180,70], 12:[150,40]};
    let svg = `<svg viewBox="0 0 200 220" width="100%"><path d="M0 20 L200 20 L200 220 L0 220 Z M0 20 L200 220 M200 20 L0 220 M100 20 L0 120 L100 220 L200 120 Z" fill="none" stroke="maroon" stroke-width="1.5"/>`;
    
    for (let i = 1; i <= 12; i++) {
        let currentSign = (ascSign + i - 2) % 12 + 1;
        svg += `<text x="${coords[i][0]}" y="${coords[i][1]}" fill="maroon" font-size="12" font-weight="bold" text-anchor="middle">${currentSign}</text>`;
        
        let pList = planets.filter(p => p[key] === (key === 'house' ? i : currentSign));
        pList.forEach((p, idx) => {
            svg += `<text x="${coords[i][0]}" y="${coords[i][1]+12+(idx*10)}" font-size="8" text-anchor="middle">${p.name.substring(0,2)}</text>`;
        });
    }
    document.getElementById(divId).innerHTML = svg + `</svg>`;
}

async function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'a4');
    const pages = document.querySelectorAll('.pdf-page');
    for (let i = 0; i < pages.length; i++) {
        const canvas = await html2canvas(pages[i], { scale: 2 });
        if (i > 0) doc.addPage();
        doc.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 210, 297);
    }
    doc.save("Kundli_Report.pdf");
}
</script>
</body>
</html>
