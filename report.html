<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Fortune Pro कुंडली रिपोर्ट</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fffdf5; padding: 20px; }
        .container { background: white; max-width: 900px; margin: auto; padding: 30px; border: 2px solid #800000; border-radius: 10px; }
        .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .c-box { border: 1.5px solid #800000; padding: 10px; text-align: center; background: #fff; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #800000; color: white; }
        .high { color: green; font-weight: bold; }
        .low { color: red; font-weight: bold; }
        .prediction { background: #fff9e6; padding: 20px; border-left: 5px solid #daa520; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align:center; color:#800000; margin-top:0;">॥ वृहद ज्योतिषीय रिपोर्ट ॥</h1>
        <div id="p-info" style="text-align:center; font-weight:bold; border-bottom:1px solid #eee; padding-bottom:10px;"></div>
        
        <div class="charts">
            <div class="c-box"><b>लग्न कुंडली (D1)</b><div id="d1"></div></div>
            <div class="c-box"><b>नवांश कुंडली (D9)</b><div id="d9"></div></div>
        </div>

        <table>
            <thead><tr><th>ग्रह</th><th>डिग्री</th><th>नक्षत्र</th><th>D1 स्थिति</th><th>D9 स्थिति</th></tr></thead>
            <tbody id="tbody"></tbody>
        </table>

        <div class="prediction">
            <h3 style="margin-top:0; color:#800000;">✨ ग्रहों का फलादेश</h3>
            <div id="preds"></div>
        </div>
        
        <h3>📅 विंशोत्तरी महादशा</h3>
        <table id="dbody"><tr><th>ग्रह</th><th>अवधि</th></tr></table>
    </div>

    <script>
        window.onload = async () => {
            const k = JSON.parse(localStorage.getItem('kData'));
            if(!k) return alert("डेटा नहीं मिला");

            try {
                const res = await fetch('https://hemantpurohit27.pythonanywhere.com/calculate', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(k)
                });
                const data = await res.json();
                if(data.status === "error") throw new Error(data.message);

                document.getElementById('p-info').innerText = `नाम: ${data.name} | अयनांश: ${data.ayan} | स्थान: ${k.city}`;
                
                let h="", pr="", ds="";
                data.planets.forEach(pl => {
                    h += `<tr><td><b>${pl.name}</b></td><td>${pl.deg}</td><td>${pl.naks}</td><td class="${pl.d1_stat=='उच्च'?'high':(pl.d1_stat=='नीच'?'low':'')}">${pl.d1_stat}</td><td class="${pl.d9_stat=='उच्च'?'high':(pl.d9_stat=='नीच'?'low':'')}">${pl.d9_stat}</td></tr>`;
                    pr += `<p><b>${pl.name}:</b> ${pl.pred}</p>`;
                });
                data.dasha.forEach(d => ds += `<tr><td><b>${d.l}</b></td><td>${d.sd} - ${d.ed}</td></tr>`);
                
                document.getElementById('tbody').innerHTML = h;
                document.getElementById('dbody').innerHTML += ds;
                document.getElementById('preds').innerHTML = pr;

                draw('d1', data.l1, data.planets, 'h');
                draw('d9', data.l9, data.planets, 'd9_h');
            } catch(e) {
                alert("सर्वर त्रुटि: " + e.message);
            }
        };

        function draw(id, asc, planets, key) {
            const pos = {1:[100,65], 2:[50,35], 3:[20,65], 4:[60,105], 5:[20,145], 6:[50,180], 7:[100,145], 8:[150,180], 9:[185,145], 10:[145,105], 11:[185,65], 12:[150,35]};
            let s = `<svg viewBox="0 0 200 200" width="100%"><path d="M0 0 L200 0 L200 200 L0 200 Z M0 0 L200 200 M200 0 L0 200 M100 0 L0 100 L100 200 L200 100 Z" fill="none" stroke="maroon" stroke-width="1.2"/>`;
            for(let i=1; i<=12; i++) {
                let r = (asc + i - 2) % 12 + 1;
                s += `<text x="${pos[i][0]}" y="${pos[i][1]}" font-size="12" fill="maroon" font-weight="bold" text-anchor="middle">${r}</text>`;
                let pNames = planets.filter(p => p[key]==i).map(p => p.name.substring(0,2)).join(' ');
                s += `<text x="${pos[i][0]}" y="${pos[i][1]+12}" font-size="8" text-anchor="middle" fill="#333" font-weight="bold">${pNames}</text>`;
            }
            document.getElementById(id).innerHTML = s + `</svg>`;
        }
</script>
</body>
</html>
