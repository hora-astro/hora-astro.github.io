<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Kundli Report</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f4f4f4; }
        .page { background: white; max-width: 900px; margin: auto; padding: 40px; border: 2px solid #800000; }
        .header-box { background: #fff8f0; border: 1px solid #800000; display: grid; grid-template-columns: repeat(3, 1fr); padding: 15px; margin-bottom: 20px; font-size: 14px; }
        .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .cbox { border: 1px solid #800000; text-align: center; padding: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #800000; color: white; }
        .high { color: green; font-weight: bold; }
        .low { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <div class="page">
        <h1 style="text-align:center; color:#800000; margin-top:0;">॥ कुंडली विश्लेषण ॥</h1>
        <div class="header-box" id="pan-data"></div>

        <div class="charts">
            <div class="cbox"><b>लग्न कुंडली (D1)</b><div id="d1"></div></div>
            <div class="cbox"><b>नवांश कुंडली (D9)</b><div id="d9"></div></div>
        </div>

        <table>
            <thead><tr><th>ग्रह</th><th>डिग्री</th><th>नक्षत्र</th><th>भाव</th><th>D1 स्थिति</th><th>D9 स्थिति</th></tr></thead>
            <tbody id="tbody"></tbody>
        </table>

        <div style="margin-top:30px; background:#fffcf0; padding:20px; border-left: 5px solid #daa520;">
            <h3>✨ फलादेश</h3>
            <div id="preds"></div>
        </div>
    </div>

    <script>
        window.onload = async () => {
            const k = JSON.parse(localStorage.getItem('kData'));
            const res = await fetch('https://hemantpurohit27.pythonanywhere.com/calculate', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(k)
            });
            const data = await res.json();
            
            const p = data.panchang;
            document.getElementById('pan-data').innerHTML = `
                <div><b>नाम:</b> ${data.name}</div><div><b>स्थान:</b> ${k.city}</div><div><b>इष्टकाल:</b> ${p.ishtakal}</div>
                <div><b>नक्षत्र:</b> ${p.naks}</div><div><b>तिथि:</b> ${p.tithi}</div><div><b>योग:</b> ${p.yoga}</div>
                <div><b>गण:</b> ${p.gan}</div><div><b>योनि:</b> ${p.yoni}</div><div><b>नाड़ी:</b> ${p.nadi}</div>
            `;

            let h="", pr="";
            data.planets.forEach(pl => {
                h += `<tr><td>${pl.name}</td><td>${pl.deg}</td><td>${pl.naks}</td><td>${pl.house}</td><td class="${pl.d1_status=='उच्च'?'high':(pl.d1_status=='नीच'?'low':'')}">${pl.d1_status}</td><td class="${pl.d9_status=='उच्च'?'high':(pl.d9_status=='नीच'?'low':'')}">${pl.d9_status}</td></tr>`;
                pr += `<p><b>${pl.name}:</b> ${pl.pred}</p>`;
            });
            document.getElementById('tbody').innerHTML = h;
            document.getElementById('preds').innerHTML = pr;

            draw('d1', data.lagna, data.planets, 'house');
            draw('d9', data.d9_lagna, data.planets, 'd9_sign');
        };

        function draw(id, asc, planets, key) {
            const pos = {1:[100,65], 2:[50,35], 3:[20,65], 4:[60,105], 5:[20,145], 6:[50,180], 7:[100,145], 8:[150,180], 9:[185,145], 10:[145,105], 11:[185,65], 12:[150,35]};
            let s = `<svg viewBox="0 0 200 200" width="100%"><path d="M0 0 L200 0 L200 200 L0 200 Z M0 0 L200 200 M200 0 L0 200 M100 0 L0 100 L100 200 L200 100 Z" fill="none" stroke="maroon" stroke-width="1.2"/>`;
            for(let i=1; i<=12; i++) {
                let r = (asc + i - 2) % 12 + 1;
                s += `<text x="${pos[i][0]}" y="${pos[i][1]}" font-size="12" fill="maroon" font-weight="bold" text-anchor="middle">${r}</text>`;
                let pNames = planets.filter(p => (key=='house'?p.house:p.d9_sign)==i).map(p => p.name.substring(0,2)).join(' ');
                s += `<text x="${pos[i][0]}" y="${pos[i][1]+12}" font-size="8" text-anchor="middle" fill="#333">${pNames}</text>`;
            }
            document.getElementById(id).innerHTML = s + `</svg>`;
        }
</script>
</body>
</html>
