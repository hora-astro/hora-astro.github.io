<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Professional Kundli Report</title>
    <style>
        body { font-family: 'Segoe UI'; background: #f0f0f0; margin: 0; padding: 20px; }
        .page { background: white; width: 210mm; margin: auto; padding: 15mm; border: 2px solid #800000; }
        .panchang-grid { display: grid; grid-template-columns: repeat(4, 1fr); background: #fff8f0; border: 1px solid #800000; margin: 20px 0; font-size: 13px; }
        .panchang-grid div { padding: 10px; border: 0.5px solid #eee; }
        .panchang-grid b { color: #800000; }
        .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chart-box { border: 1px solid #800000; text-align: center; padding: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
        th { background: #800000; color: white; }
        .high { color: green; font-weight: bold; }
        .low { color: red; font-weight: bold; }
        .pred-text { background: #fff9e6; padding: 15px; border-left: 5px solid gold; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="page">
        <h1 style="text-align:center; color:#800000;">॥ श्री गणेशाय नमः ॥</h1>
        <p id="top-info" style="text-align:center;"></p>

        <div class="panchang-grid" id="pan-table"></div>

        <div class="chart-row">
            <div class="chart-box"><b>लग्न कुंडली (D1)</b><div id="d1"></div></div>
            <div class="chart-box"><b>नवांश कुंडली (D9)</b><div id="d9"></div></div>
        </div>

        <table>
            <thead><tr><th>ग्रह</th><th>डिग्री</th><th>भाव</th><th>D9 राशि</th></tr></thead>
            <tbody id="p-rows"></tbody>
        </table>

        <div class="pred-text">
            <h3 style="color:#800000;">✨ फलादेश (डेटाबेस के अनुसार)</h3>
            <div id="predictions"></div>
        </div>
    </div>

    <script>
        window.onload = async () => {
            const k = JSON.parse(localStorage.getItem('proKundli'));
            const res = await fetch('https://hemantpurohit27.pythonanywhere.com/calculate', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(k)
            });
            const data = await res.json();
            
            document.getElementById('top-info').innerHTML = `<b>नाम:</b> ${data.name} | <b>स्थान:</b> ${k.city} | <b>अक्षांश:</b> ${k.lat} | <b>देशांतर:</b> ${k.lon}`;
            
            const p = data.panchang;
            document.getElementById('pan-table').innerHTML = `
                <div><b>नक्षत्र:</b> ${p.naks}</div><div><b>वार:</b> रविवार</div>
                <div><b>तिथि:</b> ${p.tithi}</div><div><b>योग:</b> ${p.yoga}</div>
                <div><b>करण:</b> ${p.karan}</div><div><b>गण:</b> ${p.gan}</div>
                <div><b>योनि:</b> ${p.yoni}</div><div><b>इष्टकाल:</b> ${p.ishtakal}</div>
            `;

            let p_html = "";
            data.planets.forEach(pl => {
                p_html += `<tr><td class="${pl.status}">${pl.name}</td><td>${pl.deg}</td><td>${pl.house}</td><td>${pl.d9_sign}</td></tr>`;
            });
            document.getElementById('p-rows').innerHTML = p_html;

            drawChart('d1', data.lagna, data.planets, 'house');
        };

        function drawChart(id, asc, planets, key) {
            const pos = {1:[100,65], 2:[50,35], 3:[20,65], 4:[60,105], 5:[20,145], 6:[50,180], 7:[100,145], 8:[150,180], 9:[185,145], 10:[145,105], 11:[185,65], 12:[150,35]};
            let s = `<svg viewBox="0 0 200 200" width="100%"><path d="M0 0 L200 0 L200 200 L0 200 Z M0 0 L200 200 M200 0 L0 200 M100 0 L0 100 L100 200 L200 100 Z" fill="none" stroke="maroon" stroke-width="1.2"/>`;
            for(let i=1; i<=12; i++) {
                let sign = (asc + i - 2) % 12 + 1;
                s += `<text x="${pos[i][0]}" y="${pos[i][1]}" font-size="12" fill="maroon" font-weight="bold" text-anchor="middle">${sign}</text>`;
                let pNames = planets.filter(p => (key==='house'?p.house:p.d9_sign) == i).map(p => p.name.substring(0,2)).join(' ');
                s += `<text x="${pos[i][0]}" y="${pos[i][1]+12}" font-size="8" text-anchor="middle" fill="#333">${pNames}</text>`;
            }
            document.getElementById(id).innerHTML = s + `</svg>`;
        }
</script>
</body>
</html>
