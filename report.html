<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Astrology Report</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f0f0; margin: 0; padding: 10px; }
        .container { background: white; max-width: 900px; margin: auto; padding: 20px; border: 2px solid #800000; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
        h1 { text-align: center; color: #800000; margin: 0 0 10px 0; }
        .info-bar { text-align: center; background: #fff8f0; padding: 10px; border: 1px solid #ddd; margin-bottom: 20px; font-weight: bold; }
        .ayan-tag { background: maroon; color: white; padding: 2px 8px; border-radius: 4px; margin-left: 10px; }
        .charts-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-bottom: 30px; }
        .chart-box { border: 1px solid maroon; padding: 10px; width: 350px; text-align: center; background: #fff; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: center; font-size: 14px; }
        th { background: #800000; color: white; }
        .high { color: green; font-weight: bold; }
        .low { color: red; font-weight: bold; }
        .loading { text-align: center; padding: 50px; font-size: 20px; color: maroon; }
    </style>
</head>
<body>
    <div class="container" id="mainContent">
        <div class="loading">कुंडली गणना की जा रही है, कृपया प्रतीक्षा करें...</div>
    </div>

    <script>
        // अपना PythonAnywhere यूजरनेम यहाँ डालें
        const API_URL = 'https://hemantpurohit27.pythonanywhere.com/calculate';

        window.onload = async () => {
            const userData = JSON.parse(localStorage.getItem('kData'));
            if (!userData) {
                document.getElementById('mainContent').innerHTML = "<h2>त्रुटि: कोई डेटा नहीं मिला। कृपया फॉर्म फिर से भरें।</h2>";
                return;
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                const data = await response.json();
                if (data.status === "error") throw new Error(data.message);

                renderReport(data, userData);

            } catch (err) {
                document.getElementById('mainContent').innerHTML = `<h2 style="color:red; text-align:center;">सर्वर से संपर्क नहीं हो पाया: ${err.message}</h2>`;
            }
        };

        function renderReport(data, k) {
            let html = `
                <h1>॥ श्री गणेशाय नमः ॥</h1>
                <div class="info-bar">
                    नाम: ${k.name} | स्थान: ${k.city} | दिनांक: ${k.date} | समय: ${k.time} 
                    <span class="ayan-tag">आयनांश: ${data.ayanamsa}</span>
                </div>
                
                <div class="charts-container">
                    <div class="chart-box"><b>लग्न कुंडली (D1)</b><div id="d1"></div></div>
                    <div class="chart-box"><b>नवांश कुंडली (D9)</b><div id="d9"></div></div>
                </div>

                <h3>ग्रह स्थिति</h3>
                <table>
                    <thead><tr><th>ग्रह</th><th>डिग्री</th><th>नक्षत्र</th><th>D1 स्थिति</th><th>D9 स्थिति</th></tr></thead>
                    <tbody>
                        ${data.planets.map(p => `
                            <tr>
                                <td>${p.name}</td><td>${p.deg}</td><td>${p.naks}</td>
                                <td class="${p.d1_stat==='उच्च'?'high':(p.d1_stat==='नीच'?'low':'')}">${p.d1_stat}</td>
                                <td class="${p.d9_stat==='उच्च'?'high':(p.d9_stat==='नीच'?'low':'')}">${p.d9_stat}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>

                <h3>विंशोत्तरी महादशा</h3>
                <table>
                    <thead><tr><th>स्वामी</th><th>समाप्ति तिथि</th><th>प्रकार</th></tr></thead>
                    <tbody>
                        ${data.dasha.map(d => `<tr><td>${d.l}</td><td>${d.ed}</td><td>${d.type}</td></tr>`).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById('mainContent').innerHTML = html;
            
            drawChart('d1', data.l1, data.planets, 'h');
            drawChart('d9', data.l9, data.planets, 'd9_h');
        }

        function drawChart(id, asc, planets, key) {
            const pos = {1:[100,70], 2:[50,40], 3:[25,70], 4:[65,110], 5:[25,150], 6:[50,180], 7:[100,150], 8:[150,180], 9:[175,150], 10:[135,110], 11:[175,70], 12:[150,40]};
            let s = `<svg viewBox="0 0 200 200" width="100%"><path d="M0 0 L200 0 L200 200 L0 200 Z M0 0 L200 200 M200 0 L0 200 M100 0 L0 100 L100 200 L200 100 Z" fill="none" stroke="maroon" stroke-width="1.2"/>`;
            for(let i=1; i<=12; i++) {
                let r = (asc + i - 2) % 12 + 1;
                s += `<text x="${pos[i][0]}" y="${pos[i][1]}" font-size="12" fill="maroon" font-weight="bold" text-anchor="middle">${r}</text>`;
                let pNames = planets.filter(p => p[key]==i).map(p => p.name.substring(0,2)).join(' ');
                s += `<text x="${pos[i][0]}" y="${pos[i][1]+15}" font-size="9" text-anchor="middle" fill="#d35400" font-weight="bold">${pNames}</text>`;
            }
            document.getElementById(id).innerHTML = s + `</svg>`;
        }
</script>
</body>
</html>
