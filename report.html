<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>विस्तृत कुंडली रिपोर्ट</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-4">
<div class="max-w-4xl mx-auto bg-white shadow-xl rounded-lg p-8">
    <div class="flex justify-between items-center border-b pb-4 mb-6">
        <h1 id="r-name" class="text-3xl font-bold text-blue-900">जातक कुंडली</h1>
        <button onclick="window.print()" class="bg-green-600 text-white px-4 py-2 rounded no-print">PDF सेव करें</button>
    </div>

    <section class="mb-8">
        <h2 class="text-xl font-bold text-blue-800 mb-4 border-l-4 border-blue-800 pl-2">🪐 ग्रह स्थिति</h2>
        <table class="w-full border-collapse border">
            <tr class="bg-gray-100">
                <th class="border p-2">ग्रह</th><th class="border p-2">राशि</th><th class="border p-2">भाव</th><th class="border p-2">डिग्री</th>
            </tr>
            <tbody id="p-table"></tbody>
        </table>
    </section>

    <section class="mb-8">
        <h2 class="text-xl font-bold text-blue-800 mb-4 border-l-4 border-blue-800 pl-2">⏳ विंशोत्तरी महादशा</h2>
        <div id="dasha-list" class="space-y-2"></div>
    </section>

    <section>
        <h2 class="text-xl font-bold text-blue-800 mb-4 border-l-4 border-blue-800 pl-2">🔮 फलादेश</h2>
        <div id="predictions" class="bg-blue-50 p-4 rounded-lg text-gray-700 leading-relaxed"></div>
    </section>
</div>

<script>
    const data = JSON.parse(localStorage.getItem('astro_data'));
    if(!data) window.location.href = 'index.html';

    document.getElementById('r-name').innerText = data.name;

    // Planets
    const pTable = document.getElementById('p-table');
    data.chart.planets.forEach(p => {
        pTable.innerHTML += `<tr><td class="border p-2 font-bold">${p.name}</td><td class="border p-2">${p.sign}</td><td class="border p-2">${p.house}</td><td class="border p-2">${p.degree}°</td></tr>`;
    });

    // Dasha
    const dList = document.getElementById('dasha-list');
    data.dasha.mahadasha.forEach(d => {
        dList.innerHTML += `<div class="p-3 border-l-4 border-blue-500 bg-gray-50 flex justify-between">
            <span class="font-bold">${d.planet}</span><span>${d.start} से ${d.end}</span>
        </div>`;
    });

    // Predictions
    document.getElementById('predictions').innerText = data.predictions.summary;
</script>
</body>
</html>
