<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Professional Astrology Report</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f9f9f9; padding: 20px; }
        .page { background: white; max-width: 950px; margin: auto; padding: 40px; border: 2px solid #800000; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .panchang { display: grid; grid-template-columns: repeat(4, 1fr); background: #fff8f0; border: 1px solid #800000; margin: 20px 0; padding: 15px; font-size: 14px; }
        .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .c-box { border: 1px solid #800000; padding: 10px; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 25px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background: #800000; color: white; }
        .high { color: green; font-weight: bold; }
        .low { color: red; font-weight: bold; }
        .pred-area { background: #fffdf2; border-left: 6px solid #daa520; padding: 20px; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="page">
        <h1 style="text-align:center; color:#800000; margin-top:0;">॥ श्री गणेशाय नमः ॥</h1>
        <div class="panchang" id="pan"></div>
        <div class="charts">
            <div class="c-box"><b>लग्न कुंडली (D1)</b><div id="d1"></div></div>
            <div class="c-box"><b>नवांश कुंडली (D9)</b><div id="d9"></div></div>
        </div>
        <table>
            <thead><tr><th>ग्रह</th><th>डिग्री</th><th>नक्षत्र</th><th>D1 स्थिति</th><th>D9 स्थिति</th></tr></thead>
            <tbody id="tbody"></tbody>
        </table>
        <h3 style="color:#800000; margin-top:30px; border-bottom: 2px solid #800000;">📅 विंशोत्तरी महादशा (भुक्त शेष)</h3>
        <table id="dasha"><thead><tr><th>स्वामी</th><th>समाप्ति तिथि</th><th>प्रकार</th></tr></thead><tbody id="dbody"></tbody></table>
        <div class="pred-area"><h3>✨ विस्तृत फलादेश</h3><div id="preds"></div></div>
    </div>
    <script>
        window.onload = async () => {
            const k = JSON.parse(localStorage.getItem('kData'));
            const res = await fetch('https://hemantpurohit27.pythonanywhere.com/calculate', {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(k)
            });
            const data = await res.json();
            document.getElementById('pan').innerHTML = `<div><b>नक्षत्र:</b> ${data.panchang.naks}</div><div><b>तिथि:</b> ${data.panchang.tithi}</div><div><b>इष्टकाल:</b> ${data.panchang.ishtakal}</div><div><b>स्थान:</b> ${k.city}</div>`;
            
            let h="", pr="", d="";
            data.planets.forEach(p => {
                h += `<tr><td>${p.name}</td><td>${p.deg}</td><td>${p.naks}</td><td class="${p.d1_stat=='उच्च'?'high':(p.d1_stat=='नीच'?'low':'')}">${p.d1_stat}</td><td class="${p.d9_stat=='उच्च'?'high':(p.d9_stat=='नीच'?'low':'')}">${p.d9_stat}</td></tr>`;
                pr += `<p><b>${p.name}:</b> ${p.pred}</p>`;
            });
            data.dasha.forEach(ds => d += `<tr><td>${ds.lord}</td><td>${ds.date}</td><td>${ds.type}</td></tr>`);
            document.getElementById('tbody').innerHTML = h; document.getElementById('dbody').innerHTML = d; document.getElementById('preds').innerHTML = pr;

            draw('d1', data.l1, data.planets, 'house');
            draw('d9', data.l9, data.planets, 'd9_house');
        };

        function draw(id, asc, planets, key) {
            const pos = {1:[100,65], 2:[50,35], 3:[20,65], 4:[60,105], 5:[20,145], 6:[50,180], 7:[100,145], 8:[150,180], 9:[185,145], 10:[145,105], 11:[185,65], 12:[150,35]};
            let s = `<svg viewBox="0 0 200 200" width="100%"><path d="M0 0 L200 0 L200 200 L0 200 Z M0 0 L200 200 M200 0 L0 200 M100 0 L0 100 L100 200 L200 100 Z" fill="none" stroke="maroon" stroke-width="1.2"/>`;
            for(let i=1; i<=12; i++) {
                let r = (asc + i - 2) % 12 + 1;
                s += `<text x="${pos[i][0]}" y="${pos[i][1]}" font-size="12" fill="maroon" font-weight="bold" text-anchor="middle">${r}</text>`;
                let pNames = planets.filter(p => p[key]==i).map(p => p.name.substring(0,2)).join(' ');
                s += `<text x="${pos[i][0]}" y="${pos[i][1]+12}" font-size="8" text-anchor="middle" fill="#333">${pNames}</text>`;
            }
            document.getElementById(id).innerHTML = s + `</svg>`;
        }
</script>
</body>
</html>
