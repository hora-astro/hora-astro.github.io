<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Kundli Report</title>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; margin: 0; padding: 20px; }
        .page { background: white; width: 210mm; min-height: 297mm; margin: auto; padding: 15mm; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header { text-align: center; color: #800000; border-bottom: 2px solid #800000; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
        .chart { border: 1px solid #800000; text-align: center; padding: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
        th { background: #800000; color: white; }
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; justify-content: center; align-items: center; font-size: 24px; z-index: 100; }
    </style>
</head>
<body>
    <div id="loading">गणना की जा रही है, कृपया प्रतीक्षा करें...</div>
    <div class="page">
        <div class="header">
            <h1 id="title">कुंडली रिपोर्ट</h1>
            <p id="details"></p>
        </div>
        <div class="grid">
            <div class="chart"><b>लग्न कुंडली (D1)</b><div id="d1"></div></div>
            <div class="chart"><b>नवांश कुंडली (D9)</b><div id="d9"></div></div>
        </div>
        <table>
            <thead><tr><th>ग्रह</th><th>डिग्री</th><th>भाव</th></tr></thead>
            <tbody id="pTable"></tbody>
        </table>
    </div>

    <script>
        window.onload = async () => {
            const d = JSON.parse(localStorage.getItem('kundliData'));
            if(!d) { window.location.href="index.html"; return; }

            try {
                const res = await fetch('https://hemantpurohit27.pythonanywhere.com/calculate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(d)
                });
                const data = await res.json();
                if(data.status === 'success') render(data, d);
            } catch(e) { alert("सर्वर त्रुटि!"); }
            document.getElementById('loading').style.display = 'none';
        };

        function render(data, input) {
            document.getElementById('title').innerText = data.name + " की कुंडली";
            document.getElementById('details').innerText = `जन्म तिथि: ${input.date} | समय: ${input.time} | स्थान: ${input.city}`;
            
            let html = "";
            data.planets.forEach(p => {
                html += `<tr><td>${p.name}</td><td>${p.deg}</td><td>${p.house}</td></tr>`;
            });
            document.getElementById('pTable').innerHTML = html;
            
            drawChart('d1', data.lagna, data.planets, 'house');
            drawChart('d9', data.d9_lagna, data.planets, 'd9_sign');
        }

        function drawChart(id, asc, planets, key) {
            const pos = {1:[100,60], 2:[50,30], 3:[20,60], 4:[60,100], 5:[20,140], 6:[50,170], 7:[100,140], 8:[150,170], 9:[180,140], 10:[140,100], 11:[180,60], 12:[150,30]};
            let s = `<svg viewBox="0 0 200 200" width="100%"><path d="M0 0 L200 0 L200 200 L0 200 Z M0 0 L200 200 M200 0 L0 200 M100 0 L0 100 L100 200 L200 100 Z" fill="none" stroke="maroon"/>`;
            for(let i=1; i<=12; i++) {
                let sign = (asc + i - 2) % 12 + 1;
                s += `<text x="${pos[i][0]}" y="${pos[i][1]}" font-size="12" fill="maroon" font-weight="bold">${sign}</text>`;
                let pNames = planets.filter(p => (key==='house'?p.house:p.d9_sign) == i).map(p => p.name.substring(0,2)).join(' ');
                s += `<text x="${pos[i][0]}" y="${pos[i][1]+15}" font-size="8" text-anchor="middle">${pNames}</text>`;
            }
            document.getElementById(id).innerHTML = s + `</svg>`;
        }
    </script>
</body>
</html>
