<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>विस्तृत कुंडली रिपोर्ट</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print { .no-print { display: none; } }
        .tab-content { display: none; }
        .active { display: block; }
    </style>
</head>
<body class="bg-gray-50 p-4">

<div class="max-w-4xl mx-auto bg-white shadow-lg rounded-lg overflow-hidden">
    <div class="bg-blue-800 p-6 text-white flex justify-between items-center">
        <h1 id="r-name" class="text-2xl font-bold">नाम</h1>
        <button onclick="window.print()" class="no-print bg-orange-500 px-4 py-2 rounded shadow">PDF प्रिंट करें</button>
    </div>

    <div class="flex border-b no-print bg-gray-100">
        <button onclick="showTab('t1')" class="p-4 hover:bg-white font-bold border-r">ग्रह स्थिति</button>
        <button onclick="showTab('t2')" class="p-4 hover:bg-white font-bold border-r">विंशोत्तरी दशा</button>
        <button onclick="showTab('t3')" class="p-4 hover:bg-white font-bold">भविष्यफल</button>
    </div>

    <div class="p-6">
        <div id="t1" class="tab-content active">
            <h3 class="text-xl font-bold mb-4 text-blue-800">नक्षत्र और ग्रह विवरण</h3>
            <table class="w-full border-collapse">
                <thead>
                    <tr class="bg-blue-100">
                        <th class="border p-2">ग्रह</th>
                        <th class="border p-2">राशि</th>
                        <th class="border p-2">अंश</th>
                        <th class="border p-2">भाव</th>
                    </tr>
                </thead>
                <tbody id="planet-body"></tbody>
            </table>
        </div>

        <div id="t2" class="tab-content">
            <h3 class="text-xl font-bold mb-4 text-blue-800">विंशोत्तरी महादशा समयरेखा</h3>
            <div id="dasha-list" class="space-y-2"></div>
        </div>

        <div id="t3" class="tab-content">
            <h3 class="text-xl font-bold mb-4 text-blue-800">विस्तृत फलादेश</h3>
            <div id="pred-content" class="prose max-w-none text-gray-700"></div>
        </div>
    </div>
</div>

<script>
    const data = JSON.parse(localStorage.getItem('kundli_data'));
    if(!data) window.location.href = 'index.html';

    // Populate Data
    document.getElementById('r-name').innerText = `कुंडली: ${data.name}`;

    // Planets
    const pBody = document.getElementById('planet-body');
    data.chart.planets.forEach(p => {
        pBody.innerHTML += `<tr class="text-center">
            <td class="border p-2 font-bold">${p.name}</td>
            <td class="border p-2">${p.sign}</td>
            <td class="border p-2">${p.degree}°</td>
            <td class="border p-2">${p.house}</td>
        </tr>`;
    });

    // Dasha
    const dList = document.getElementById('dasha-list');
    data.dasha.mahadasha.forEach(d => {
        dList.innerHTML += `<div class="p-3 border-l-4 border-blue-500 bg-gray-50 flex justify-between">
            <span class="font-bold">${d.planet}</span>
            <span>${d.start} से ${d.end}</span>
        </div>`;
    });

    // Predictions
    const pCont = document.getElementById('pred-content');
    pCont.innerHTML = `
        <div class="mb-4 p-4 bg-orange-50 rounded"><strong>सारांश:</strong> ${data.predictions.summary}</div>
        <div class="grid md:grid-cols-2 gap-4">
            <div class="p-4 border rounded"><strong>💼 करियर:</strong><br>${data.predictions.career}</div>
            <div class="p-4 border rounded"><strong>🩺 स्वास्थ्य:</strong><br>${data.predictions.health}</div>
        </div>
    `;

    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
</html>
