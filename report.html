<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>कुंडली रिपोर्ट - Fortune Pro</title>
    <style>
        @media print { .no-print { display: none; } body { padding: 0; } .container { border: none; box-shadow: none; } }
        body { font-family: 'Segoe UI', Arial; background: #f0f0f0; margin: 0; padding: 20px; }
        .container { background: white; max-width: 1000px; margin: auto; padding: 50px; border: 1px solid #ccc; box-shadow: 0 0 30px rgba(0,0,0,0.1); border-top: 15px solid #800000; }
        .header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #800000; padding-bottom: 15px; margin-bottom: 20px; }
        .panchang-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #fffcf0; padding: 20px; border: 1px solid #e0d0b0; border-radius: 10px; margin-bottom: 30px; }
        .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin: 30px 0; }
        .c-box { border: 2px solid #800000; padding: 15px; background: #fff; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background: #800000; color: white; text-transform: uppercase; font-size: 13px; }
        .high { color: #27ae60; font-weight: bold; }
        .low { color: #e74c3c; font-weight: bold; }
        .pred-section { background: #fffdf5; border-left: 8px solid #daa520; padding: 25px; margin-top: 40px; border-radius: 0 10px 10px 0; }
        .btn-print { background: #27ae60; color: white; padding: 10px 25px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .dasha-table tr:nth-child(even) { background: #f9f9f9; }
    </style>
</head>
<body>
    <div class="no-print" style="text-align: center; margin-bottom: 20px;">
        <button class="btn-print" onclick="window.print()">🖨 रिपोर्ट प्रिंट करें</button>
        <button onclick="location.href='index.html'" style="padding:10px; cursor:pointer;">⬅ नया चार्ट</button>
    </div>

    <div class="container" id="reportContent">
        <div class="header-top">
            <h1 style="color:#800000; margin:0;">॥ श्री गणेशाय नमः ॥</h1>
            <div id="date-now" style="font-size: 12px; color: #666;"></div>
        </div>
        
        <h2 style="text-align:center; color:#800000;">ज्योतिषीय विश्लेषण रिपोर्ट</h2>
        <div id="personal" style="text-align:center; background:#800000; color:white; padding:10px; border-radius:5px; margin-bottom:20px;"></div>
        
        <div class="panchang-grid" id="pan"></div>

        <div class="charts">
            <div class="c-box"><h3>लग्न कुंडली (D1)</h3><div id="d1"></div></div>
            <div class="c-box"><h3>नवांश कुंडली (D9)</h3><div id="d9"></div></div>
        </div>

        <h3>🪐 ग्रह स्पष्ट एवं स्थिति</h3>
        <table>
            <thead><tr><th>ग्रह</th><th>डिग्री</th><th>नक्षत्र</th><th>D1 स्थिति</th><th>D9 स्थिति</th><th>दृष्टि</th></tr></thead>
            <tbody id="tbody"></tbody>
        </table>

        <h3>📅 विंशोत्तरी महादशा एवं वर्तमान अंतर्दशा</h3>
        <table class="dasha-table">
            <thead><tr><th>महादशा स्वामी</th><th>अवधि</th><th>वर्तमान अंतर्दशाएं</th></tr></thead>
            <tbody id="dbody"></tbody>
        </table>

        <div class="pred-section">
            <h3 style="color:#800000; margin-top:0;">✨ विस्तृत फलादेश (JSON आधारित)</h3>
            <div id="preds" style="line-height:1.8; color:#333;"></div>
        </div>
    </div>

    <script>
        window.onload = async () => {
            document.getElementById('date-now').innerText = "Generated on: " + new Date().toLocaleString();
            const k = JSON.parse(localStorage.getItem('kData'));
            if(!k) { window.location.href="index.html"; return; }

            const res = await fetch('https://hemantpurohit27.pythonanywhere.com/calculate', {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(k)
            });
            const data = await res.json();
            
            document.getElementById('personal').innerText = `जातक: ${data.name} | स्थान: ${k.city.split(',')[0]} | जन्म तिथि: ${k.date} | समय: ${k.time} | अयनांश: ${data.ayan}`;
            
            const p = data.pan;
            document.getElementById('pan').innerHTML = `
                <div><b>नक्षत्र:</b><br>${p.naks}</div><div><b>तिथि:</b><br>${p.tithi}</div><div><b>योग:</b><br>${p.yoga}</div><div><b>गण:</b><br>${p.gan}</div>
                <div><b>योनि:</b><br>${p.yoni}</div><div><b>नाड़ी:</b><br>${p.nadi}</div><div><b>वर्ण:</b><br>ब्राह्मण</div><div><b>वश्य:</b><br>जलचर</div>
            `;

            let h="", pr="", ds="";
            data.planets.forEach(pl => {
                h += `<tr><td><b>${pl.name}</b></td><td>${pl.deg}</td><td>${pl.naks}</td><td class="${pl.d1_stat=='उच्च'?'high':(pl.d1_stat=='नीच'?'low':'')}">${pl.d1_stat}</td><td class="${pl.d9_stat=='उच्च'?'high':(pl.d9_stat=='नीच'?'low':'')}">${pl.d9_stat}</td><td>${pl.aspect}</td></tr>`;
                pr += `<p style="margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:5px;"><b>${pl.name}:</b> ${pl.pred}</p>`;
            });

            data.dasha.forEach(d => {
                let subs = d.subs.map(s => `<span style="font-size:11px; margin-right:8px;">${s.l}: ${s.ed}</span>`).join(' | ');
                ds += `<tr><td><b>${d.l}</b></td><td>${d.sd} - ${d.ed}</td><td style="text-align:left;">${subs || '-'}</td></tr>`;
            });
            
            document.getElementById('tbody').innerHTML = h;
            document.getElementById('dbody').innerHTML = ds;
            document.getElementById('preds').innerHTML = pr;

            draw('d1', data.l1, data.planets, 'h');
            draw('d9', data.l9, data.planets, 'd9_h');
        };

        function draw(id, asc, planets, key) {
            const pos = {1:[100,65], 2:[50,35], 3:[20,65], 4:[60,105], 5:[20,145], 6:[50,180], 7:[100,145], 8:[150,180], 9:[185,145], 10:[145,105], 11:[185,65], 12:[150,35]};
            let s = `<svg viewBox="0 0 200 200" width="100%"><path d="M0 0 L200 0 L200 200 L0 200 Z M0 0 L200 200 M200 0 L0 200 M100 0 L0 100 L100 200 L200 100 Z" fill="none" stroke="maroon" stroke-width="1.5"/>`;
            for(let i=1; i<=12; i++) {
                let r = (asc + i - 2) % 12 + 1;
                s += `<text x="${pos[i][0]}" y="${pos[i][1]}" font-size="14" fill="maroon" font-weight="bold" text-anchor="middle">${r}</text>`;
                let pGroup = planets.filter(p => p[key]==i);
                pGroup.forEach((p, idx) => {
                    s += `<text x="${pos[i][0]}" y="${pos[i][1]+12+(idx*10)}" font-size="9" text-anchor="middle" fill="#444" font-weight="bold">${p.name.substring(0,2)}</text>`;
                });
            }
            document.getElementById(id).innerHTML = s + `</svg>`;
        }
</script>
</body>
</html>
