<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Professional Kundli Report</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 10px; }
        .container { background: white; max-width: 850px; margin: auto; padding: 20px; border: 1px solid #800000; }
        .pan-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; background: #fff8f0; border: 1px solid #eee; padding: 10px; font-size: 12px; margin-bottom: 15px; }
        .charts { display: flex; gap: 10px; margin-bottom: 20px; }
        .c-box { flex: 1; border: 1px solid #800000; padding: 5px; text-align: center; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 20px; }
        th { background: #800000; color: white; padding: 8px; }
        td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        #error-msg { color: red; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align:center; color:#800000; margin:5px;">॥ श्री गणेशाय नमः ॥</h2>
        <div id="error-msg"></div>
        <div id="loading" style="text-align:center;">डेटा लोड हो रहा है...</div>

        <div id="main-content" style="display:none;">
            <p style="text-align:center; font-size:12px;"><b>प्रयुक्त अयनांश:</b> <span id="ayan-info"></span></p>
            <div class="pan-grid" id="pan"></div>
            
            <div class="charts">
                <div class="c-box"><b>लग्न कुंडली (D1)</b><div id="d1-chart"></div></div>
                <div class="c-box"><b>नवांश कुंडली (D9)</b><div id="d9-chart"></div></div>
            </div>

            <table>
                <thead><tr><th>ग्रह</th><th>डिग्री</th><th>नक्षत्र</th><th>भाव</th><th>D9 राशि</th></tr></thead>
                <tbody id="p-body"></tbody>
            </table>

            <h4 style="color:#800000; border-bottom:1px solid #800000;">📅 विंशोत्तरी अंतर्दशा (भुक्त शेष सहित)</h4>
            <table>
                <thead><tr><th>महादशा</th><th>अंतर्दशा</th><th>समाप्ति तिथि</th></tr></thead>
                <tbody id="d-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        window.onload = async () => {
            const input = JSON.parse(localStorage.getItem('kundliInput') || localStorage.getItem('kData'));
            if(!input) { document.getElementById('error-msg').innerText = "Input data missing!"; return; }

            try {
                const response = await fetch('https://hemantpurohit27.pythonanywhere.com/calculate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(input)
                });

                const data = await response.json();
                if(data.status === "success") {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('main-content').style.display = 'block';
                    document.getElementById('ayan-info').innerText = data.ayan;
                    
                    const p = data.pan;
                    document.getElementById('pan').innerHTML = `
                        <div><b>नक्षत्र:</b> ${p.naks}</div><div><b>तिथि:</b> ${p.tithi}</div><div><b>योग:</b> ${p.yoga}</div><div><b>इष्टकाल:</b> ${p.ishtakal}</div>
                        <div><b>गण:</b> ${p.gan}</div><div><b>योनि:</b> ${p.yoni}</div><div><b>नाड़ी:</b> ${p.nadi}</div><div><b>वर्ण:</b> ${p.varna}</div>`;

                    let pRows = "", dRows = "";
                    data.planets.forEach(pl => {
                        pRows += `<tr><td>${pl.name}</td><td>${pl.deg}</td><td>${pl.naks}</td><td>${pl.h}</td><td>${pl.d9_r}</td></tr>`;
                    });
                    data.dasha.forEach(ds => {
                        dRows += `<tr><td>${ds.ml}</td><td>${ds.al}</td><td>${ds.ed}</td></tr>`;
                    });
                    document.getElementById('p-body').innerHTML = pRows;
                    document.getElementById('d-body').innerHTML = dRows;

                    // कुंडली ड्रॉ करने का फंक्शन यहाँ कॉल करें
                } else {
                    document.getElementById('error-msg').innerText = "Server Error: " + data.message;
                }
            } catch (err) {
                document.getElementById('error-msg').innerText = "कनैक्शन एरर! कृपया सर्वर रीलोड करें।";
            }
        };
</script>
</body>
</html>
