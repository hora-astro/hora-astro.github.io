<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Advanced Kundli Report</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; padding: 20px; }
        .page { background: white; max-width: 900px; margin: auto; padding: 40px; border: 3px double #800000; }
        .panchang-box { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #fff8f0; padding: 20px; border: 1px solid #800000; margin-bottom: 20px; font-size: 13px; }
        .panchang-box b { color: #800000; }
        .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .chart-container { border: 1px solid #800000; text-align: center; background: #fff; padding: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 25px; }
        th, td { border: 1px solid #ccc; padding: 12px; text-align: center; }
        th { background: #800000; color: white; }
        .high { color: green; font-weight: bold; } /* उच्च (Green) */
        .low { color: red; font-weight: bold; }   /* नीच (Red) */
        .pred-box { background: #fffdf2; border-left: 5px solid #daa520; padding: 15px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="page">
        <h1 style="text-align:center; color:#800000; margin-top:0;">॥ कुंडली विश्लेषण ॥</h1>
        
        <div class="panchang-box" id="panData"></div>

        <div class="charts">
            <div class="chart-container"><b>लग्न कुंडली (D1)</b><div id="d1"></div></div>
            <div class="chart-container"><b>नवांश कुंडली (D9)</b><div id="d9"></div></div>
        </div>

        <table>
            <thead><tr><th>ग्रह</th><th>डिग्री</th><th>नक्षत्र</th><th>भाव</th><th>D9 राशि</th></tr></thead>
            <tbody id="pBody"></tbody>
        </table>

        <div class="pred-box">
            <h3>✨ विस्तृत फलादेश (डेटाबेस के अनुसार)</h3>
            <div id="pTexts"></div>
        </div>
    </div>

    <script>
        window.onload = async () => {
            const k = JSON.parse(localStorage.getItem('kData'));
            const res = await fetch('https://hemantpurohit27.pythonanywhere.com/calculate', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(k)
            });
            const data = await res.json();
            
            // पंचांग प्रदर्शन
            const p = data.panchang;
            document.getElementById('panData').innerHTML = `
                <div><b>नक्षत्र:</b> ${p.naks}</div><div><b>इष्टकाल:</b> ${p.ghati}</div>
                <div><b>तिथि:</b> ${p.tithi}</div><div><b>योग:</b> ${p.yoga}</div>
                <div><b>करण:</b> ${p.karan}</div><div><b>नाम:</b> ${data.name}</div>
            `;

            // ग्रह टेबल (उच्च-नीच रंग के साथ)
            let rows = "";
            data.planets.forEach(pl => {
                rows += `<tr>
                    <td class="${pl.status}">${pl.name}</td>
                    <td>${pl.deg}</td><td>${pl.naks}</td><td>${pl.house}</td><td>${pl.d9_sign}</td>
                </tr>`;
            });
            document.getElementById('pBody').innerHTML = rows;

            // फलादेश
            document.getElementById('pTexts').innerHTML = data.predictions.map(pr => `<p><b>${pr.planet}:</b> ${pr.text}</p>`).join('');

            // चार्ट ड्राइंग
            drawChart('d1', data.lagna, data.planets, 'house');
            drawChart('d9', data.d9_lagna, data.planets, 'd9_sign');
        };

        function drawChart(id, asc, planets, key) {
            const pos = {1:[100,65], 2:[50,35], 3:[20,65], 4:[60,105], 5:[20,145], 6:[50,180], 7:[100,145], 8:[150,180], 9:[185,145], 10:[145,105], 11:[185,65], 12:[150,35]};
            let s = `<svg viewBox="0 0 200 200" width="100%"><path d="M0 0 L200 0 L200 200 L0 200 Z M0 0 L200 200 M200 0 L0 200 M100 0 L0 100 L100 200 L200 100 Z" fill="none" stroke="maroon" stroke-width="1.2"/>`;
            for(let i=1; i<=12; i++) {
                let sign = (asc + i - 2) % 12 + 1;
                s += `<text x="${pos[i][0]}" y="${pos[i][1]}" font-size="12" fill="maroon" font-weight="bold" text-anchor="middle">${sign}</text>`;
                let pNames = planets.filter(p => (key==='house'?p.house:p.d9_sign) == i).map(p => p.name.substring(0,2)).join(' ');
                s += `<text x="${pos[i][0]}" y="${pos[i][1]+12}" font-size="8" text-anchor="middle" fill="#333">${pNames}</text>`;
            }
            document.getElementById(id).innerHTML = s + `</svg>`;
        }
    </script>
</body>
</html>
